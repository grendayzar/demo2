<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verdad — Accident Professionals Operating Platform (Demo)</title>
<meta name="theme-color" content="#FFBD15">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   VÍNCULO DESIGN SYSTEM
   Brand yellow carries identity + primary action ONLY.
   Status uses a deliberately non-yellow scale (see Part 28.1).
   ============================================================ */
:root{
  --y:#FFBD15; --yp:#E0A100; --ysoft:#FFF4D1;
  --ok:#1FA97C; --warn:#E8590C; --stop:#D6293E; --neutral:#6E6E78; --info:#3B82C4;
  --viz1:#FFBD15; --viz2:#3B82C4; --viz3:#1FA97C; --viz4:#C4519E; --viz5:#E8590C; --viz6:#7B8794;
  --r:10px; --rs:6px;
  --f-ui:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sp:4px;
}
html[data-theme="dark"]{
  --s0:#0B0B0C; --s1:#141416; --s2:#1D1D20; --s3:#2A2A2E; --line:#3A3A40;
  --tp:#FAFAFA; --ts:#A8A8B0; --tt:#6E6E78; --shadow:0 8px 32px rgba(0,0,0,.6);
  --tintA:.16;
}
html[data-theme="light"]{
  --s0:#FFFFFF; --s1:#F7F7F8; --s2:#FFFFFF; --s3:#EFEFF1; --line:#DCDCE0;
  --tp:#0B0B0C; --ts:#55555E; --tt:#8A8A94; --shadow:0 8px 28px rgba(11,11,12,.12);
  --tintA:.10;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--s0); color:var(--tp);
  font-family:var(--f-ui); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--y);color:#000}
:focus-visible{outline:2px solid var(--y);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--ts)} .dim{color:var(--tt)}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tt)}
.cap{font-size:12px;color:var(--ts)}
.row{display:flex;align-items:center;gap:8px}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1;min-width:0}
.hide{display:none !important}

/* ---------- APP SHELL ---------- */
#app{display:grid;grid-template-rows:52px 1fr;height:100vh}
#topbar{
  display:flex;align-items:center;gap:12px;padding:0 14px;
  background:var(--s1);border-bottom:1px solid var(--line);z-index:40;
}
#shell{display:grid;grid-template-columns:236px 1fr;min-height:0}
#rail{
  background:var(--s1);border-right:1px solid var(--line);
  overflow-y:auto;padding:10px 8px 40px;
}
#main{overflow-y:auto;padding:20px 24px 80px;min-width:0;background:var(--s0)}
.mark{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em}
.mark .iso{
  width:26px;height:26px;background:var(--y);color:#000;display:grid;place-items:center;
  font-weight:700;font-size:13px;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);
}
.mark small{display:block;font-size:9px;letter-spacing:.14em;color:var(--tt);font-weight:600;line-height:1}

/* ---------- NAV ---------- */
.navgrp{margin:12px 0 4px;padding:0 8px}
.navitem{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:var(--rs);
  color:var(--ts);font-size:13px;font-weight:500;text-align:left;
}
.navitem:hover{background:var(--s3);color:var(--tp)}
.navitem.on{background:var(--s3);color:var(--tp);font-weight:600;box-shadow:inset 2px 0 0 var(--y)}
.navitem .ico{width:16px;text-align:center;opacity:.85;flex:none}
.navitem .bdg{
  margin-left:auto;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;
  background:var(--s0);color:var(--ts);font-family:var(--f-mono);
}
.navitem .bdg.hot{background:var(--stop);color:#fff}
.navitem .bdg.warn{background:var(--warn);color:#fff}

/* ---------- POSTURE PIN ---------- */
.posture{
  margin:14px 8px 4px;padding:10px;border-radius:var(--rs);border:1px solid var(--line);
  background:var(--s2);cursor:pointer;text-align:left;width:calc(100% - 16px);
}
.posture:hover{border-color:var(--y)}
.posture .dot{width:9px;height:9px;border-radius:50%;flex:none}

/* ---------- CARDS ---------- */
.card{background:var(--s2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.pad0{padding:0}
.card h3{font-size:14px;font-weight:600;margin-bottom:2px}
.evi{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);border-color:var(--yp)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- PAGE HEAD ---------- */
.phead{margin-bottom:16px}
.phead h1{font-size:25px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.phead p{color:var(--ts);font-size:13px;margin-top:3px;max-width:74ch}

/* ---------- KPI ---------- */
.kpi{background:var(--s2);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;cursor:pointer;text-align:left;width:100%}
.kpi:hover{border-color:var(--yp)}
.kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1.1;letter-spacing:-.02em}
.kpi .k{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tt);margin-bottom:6px}
.kpi .d{font-size:11px;color:var(--ts);margin-top:5px}

/* ---------- PILLS ---------- */
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:20px;white-space:nowrap;line-height:1.6;
}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.nodot::before{display:none}
.p-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) var(--tintA),transparent)}
.p-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) var(--tintA),transparent)}
.p-stop{color:var(--stop);background:color-mix(in srgb,var(--stop) var(--tintA),transparent)}
.p-info{color:var(--info);background:color-mix(in srgb,var(--info) var(--tintA),transparent)}
.p-neutral{color:var(--tt);background:color-mix(in srgb,var(--neutral) var(--tintA),transparent)}
.p-brand{color:var(--yp);background:color-mix(in srgb,var(--y) var(--tintA),transparent)}
html[data-theme="dark"] .p-brand{color:var(--y)}
.lang{font-family:var(--f-mono);font-size:10px;font-weight:500;padding:1px 5px;border-radius:3px;border:1px solid var(--line);color:var(--ts)}

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 13px;border-radius:var(--rs);font-size:13px;font-weight:600;
  border:1px solid var(--line);background:var(--s3);color:var(--tp);white-space:nowrap;
}
.btn:hover{border-color:var(--tt)}
.btn.pri{background:var(--y);color:#000;border-color:var(--y)}
.btn.pri:hover{background:var(--yp);border-color:var(--yp)}
.btn.danger{background:transparent;color:var(--stop);border-color:color-mix(in srgb,var(--stop) 40%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--stop) 14%,transparent)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ---------- TABLES ---------- */
.tw{overflow-x:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
thead th{
  text-align:left;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--tt);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--s2);
}
thead th.num{text-align:right}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--s3)}
tbody tr:last-child td{border-bottom:none}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.neg{color:var(--stop)}

/* ---------- LIST ROWS ---------- */
.lrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:var(--s3)}
.av{
  width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:10px;font-weight:700;background:var(--s3);color:var(--ts);border:1px solid var(--line);
}
.av.y{background:var(--y);color:#000;border-color:var(--y)}
.av.lg{width:40px;height:40px;font-size:13px}

/* ---------- BARS ---------- */
.bar{height:6px;border-radius:4px;background:var(--s3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--y)}
.bar>i.ok{background:var(--ok)} .bar>i.warn{background:var(--warn)} .bar>i.stop{background:var(--stop)}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px}
.spark i{flex:1;background:var(--s3);border-radius:1px;min-height:2px}
.spark i.hi{background:var(--y)}

/* ---------- COMPLIANCE RAIL (Part 28.6) ---------- */
.crail{border-radius:var(--rs);transition:all .2s ease;overflow:hidden}
.crail.green{height:6px;background:var(--ok)}
.crail.amber{padding:11px 13px;background:color-mix(in srgb,var(--warn) var(--tintA),transparent);border:1px solid var(--warn)}
.crail.red{padding:15px;background:color-mix(in srgb,var(--stop) var(--tintA),transparent);border:1px solid var(--stop)}

/* ---------- CHAT ---------- */
.msgs{display:flex;flex-direction:column;gap:2px;padding:12px}
.msg{display:flex;gap:9px;padding:6px 4px;border-radius:var(--rs)}
.msg:hover{background:var(--s3)}
.msg .b{flex:1;min-width:0}
.msg .who{font-weight:600;font-size:12.5px}
.msg .t{font-size:10px;color:var(--tt);font-family:var(--f-mono)}
.msg .tx{font-size:13px;color:var(--tp);white-space:pre-wrap;word-break:break-word}
.msg.me .who{color:var(--y)}
html[data-theme="light"] .msg.me .who{color:var(--yp)}
.rx{display:inline-flex;gap:4px;margin-top:4px}
.rx b{font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px;background:var(--s3);border:1px solid var(--line);cursor:pointer}
.rx b:hover{border-color:var(--y)}
.composer{display:flex;gap:8px;padding:11px;border-top:1px solid var(--line);background:var(--s2)}
.composer input{flex:1;background:var(--s0);border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px}
.composer input:focus{outline:none;border-color:var(--y)}

/* ---------- FORMS ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tt);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;background:var(--s0);border:1px solid var(--line);border-radius:var(--rs);padding:8px 10px;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--y)}
.field textarea{min-height:78px;resize:vertical;font-family:inherit}
.hint{font-size:11px;color:var(--tt);margin-top:4px}

/* ---------- MODAL ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:90;display:none;padding:32px 16px;overflow-y:auto}
#scrim.on{display:block}
.modal{
  max-width:720px;margin:0 auto;background:var(--s1);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;
}
.modal.wide{max-width:960px}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.mbody{padding:18px;max-height:66vh;overflow-y:auto}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:13px 18px;border-top:1px solid var(--line);background:var(--s2)}
.x{width:28px;height:28px;border-radius:var(--rs);display:grid;place-items:center;color:var(--ts);font-size:17px;flex:none}
.x:hover{background:var(--s3);color:var(--tp)}

/* ---------- TOASTS ---------- */
#toasts{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{
  background:var(--s2);border:1px solid var(--line);border-left:3px solid var(--y);
  border-radius:var(--rs);padding:11px 13px;box-shadow:var(--shadow);animation:tin .18s ease;
}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)} .toast.stop{border-left-color:var(--stop)}
.toast b{display:block;font-size:13px;margin-bottom:2px}
.toast span{font-size:12px;color:var(--ts)}
.toast .sim{display:block;font-size:10px;color:var(--tt);margin-top:5px;font-family:var(--f-mono)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- DROPDOWN / PALETTE ---------- */
.dd{position:relative}
.ddm{
  position:absolute;top:calc(100% + 6px);right:0;min-width:250px;background:var(--s2);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:60;
  padding:6px;max-height:420px;overflow-y:auto;
}
.ddm button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:var(--rs);font-size:13px;color:var(--ts)}
.ddm button:hover{background:var(--s3);color:var(--tp)}
.ddm button.on{color:var(--tp);font-weight:600}
.ddh{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tt);padding:9px 10px 4px}
#palette{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:none;padding-top:12vh}
#palette.on{display:block}
.pbox{max-width:560px;margin:0 auto;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.pbox input{width:100%;background:transparent;border:none;padding:15px 17px;font-size:15px;border-bottom:1px solid var(--line)}
.pbox input:focus{outline:none}
.plist{max-height:400px;overflow-y:auto;padding:6px}
.pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;border-radius:var(--rs);font-size:13px}
.pitem:hover,.pitem.sel{background:var(--s3)}
.pitem .k{margin-left:auto;font-size:10px;color:var(--tt);font-family:var(--f-mono)}

/* ---------- EMPTY ---------- */
.empty{padding:44px 22px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);background:var(--s1)}
.empty .e{font-size:26px;margin-bottom:8px;opacity:.5}
.empty b{display:block;font-size:14px;margin-bottom:4px}
.empty span{font-size:12.5px;color:var(--ts);display:block;max-width:44ch;margin:0 auto 12px}

/* ---------- TIMELINE ---------- */
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:4px;top:5px;bottom:5px;width:1px;background:var(--line)}
.tli{position:relative;padding:7px 0;font-size:12.5px}
.tli::before{content:"";position:absolute;left:-18px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--tt);border:2px solid var(--s2)}
.tli.hi::before{background:var(--y)}
.tli.bad::before{background:var(--stop)}

/* ---------- MISC ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 13px;font-size:13px;font-weight:600;color:var(--ts);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--tp);border-bottom-color:var(--y)}
.tab:hover{color:var(--tp)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--tt);font-size:12px}
.cite{font-family:var(--f-mono);font-size:11px;color:var(--info);border-bottom:1px dotted currentColor;cursor:pointer}
#hamb{display:none}
footer.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--tt);line-height:1.7}

/* ---------- SEGMENTED VIEW SWITCHER ---------- */
.seg{display:inline-flex;background:var(--s3);border:1px solid var(--line);border-radius:var(--rs);padding:2px;gap:2px}
.seg button{padding:5px 11px;border-radius:4px;font-size:12px;font-weight:600;color:var(--ts);white-space:nowrap}
.seg button.on{background:var(--s1);color:var(--tp);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.seg button:hover{color:var(--tp)}

/* ---------- KANBAN ---------- */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 262px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);max-height:70vh;display:flex;flex-direction:column}
.colh{display:flex;align-items:center;gap:7px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--s1);border-radius:var(--r) var(--r) 0 0}
.colh .swatch{width:8px;height:8px;border-radius:2px;flex:none}
.colh .n{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.colh .c{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--tt)}
.colb{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px}
.kcard{background:var(--s2);border:1px solid var(--line);border-radius:var(--rs);padding:9px 10px;text-align:left;width:100%;display:block}
.kcard:hover{border-color:var(--y)}
.kcard .t{font-size:12.5px;font-weight:600;margin-bottom:3px}
.kcard .m{font-size:11px;color:var(--ts)}
.kcard .f{display:flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap}
.mover{display:flex;gap:3px;margin-top:7px;flex-wrap:wrap}
.mover b{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;background:var(--s3);border:1px solid var(--line);cursor:pointer;color:var(--ts)}
.mover b:hover{border-color:var(--y);color:var(--tp)}

/* ---------- CALENDAR ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .dh{background:var(--s1);padding:7px 8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tt);text-align:center}
.cal .dc{background:var(--s2);min-height:96px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;align-items:stretch}
.cal .dc.off{background:var(--s1);opacity:.5}
.cal .dc.today{box-shadow:inset 0 0 0 2px var(--y)}
.cal .dn{font-family:var(--f-mono);font-size:11px;color:var(--tt)}
.cal .dc.today .dn{color:var(--y);font-weight:700}
.ev{font-size:10.5px;padding:2px 5px;border-radius:3px;background:var(--s3);border-left:2px solid var(--tt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ev:hover{background:var(--s0)}
.ev.brand{border-left-color:var(--y)} .ev.ok{border-left-color:var(--ok)}
.ev.warn{border-left-color:var(--warn)} .ev.stop{border-left-color:var(--stop)} .ev.info{border-left-color:var(--info)}
.agenda{display:flex;gap:10px;padding:9px 11px;border-bottom:1px solid var(--line);align-items:flex-start;text-align:left;width:100%}
.agenda:last-child{border-bottom:none}
.agenda:hover{background:var(--s3)}
.agenda .tm{font-family:var(--f-mono);font-size:11px;color:var(--tt);width:60px;flex:none;padding-top:2px}
.agenda .bl{width:3px;border-radius:2px;align-self:stretch;flex:none;background:var(--tt)}
.agenda .bl.brand{background:var(--y)} .agenda .bl.ok{background:var(--ok)}

(function(){

     records (the blown shot clock, the statute emergency) are never absorbed. */
  var PROTECTED={};
  CANDIDATES.filter(function(c){return c.state==='OFFERED'&&c.clockEnds<NOW}).forEach(function(c){PROTECTED[c.id]=1});
  PROTECTED[CANDIDATES[42].id]=1; PROTECTED[CANDIDATES[9].id]=1; PROTECTED[CANDIDATES[70].id]=1;
  var byState={};
  ['ENGAGED','PLACED','QUALIFIED','SCREENING','NURTURE','OFFERED'].forEach(function(st){
    byState[st]=CANDIDATES.filter(function(c){return c.state===st&&!PROTECTED[c.id]&&!c.groupId});
  });
  var order=['ENGAGED','ENGAGED','PLACED','ENGAGED','SCREENING','QUALIFIED','ENGAGED','PLACED','NURTURE','QUALIFIED'];
  function draw(i){
    var want=order[i%order.length];
    var chain=[want,'ENGAGED','PLACED','QUALIFIED','SCREENING','NURTURE','OFFERED'];
    for(var k=0;k<chain.length;k++){ if(byState[chain[k]]&&byState[chain[k]].length)return byState[chain[k]].shift() }
    return null;
  }
  GROUPS.forEach(function(g,gi){
    g.members=[]; g.incident=ago(g.incidentAgo); g.sol=g.incident+730*DAY;
    g.coordinator=pick(['u.morales','u.beltran','u.rios','u.tavares']);

      c.incident=g.incident; c.sol=g.sol;
      c.groupRole=i===0?'LEAD':'MEMBER';
      g.members.push(c.id);

    /* the group inherits the placement of its lead member where one exists */
    var placed=g.members.map(cand).filter(function(c){return c&&c.firm});

    }
    g.engaged=g.members.map(cand).filter(function(c){return c&&(c.state==='ENGAGED'||c.state==='RESOLVED')}).length;

  });

function actFor(uid,days){
  var d=days===undefined?14:days;
  return ACTIVITY.filter(function(a){return a.user===uid&&a.daysAgo<d});
}
function actSummary(uid,days){
  var rows=actFor(uid,days), t={tracked:0,core:0,comms:0,docs:0,idle:0,other:0,active:0,keys:0,clicks:0,shots:0,flags:0,days:0};
  rows.forEach(function(r){for(var k in t)if(k!=='days')t[k]+=r[k]||0; if(r.tracked)t.days++});
  /* Focus counts core system work AND claimant conversation. Calls are the job on
     the intake floor; a definition that treated them as overhead would make the
     best specialist look like the worst one. */
  t.focus=t.active?Math.round((t.core+t.comms)/t.active*100):0;
  t.util=t.tracked?Math.round(t.active/t.tracked*100):0;
  /* Productivity Index: what the person produced, weighted against tracked time.
     Deliberately blends output with activity so keyboard noise alone cannot move it. */
  var out=outputFor(uid);
  t.output=out;
  t.pi=t.tracked?Math.max(0,Math.min(100,Math.round(0.45*t.focus+0.25*t.util+0.30*Math.min(100,out.score)))):0;
  return t;
}
function outputFor(uid){
  var o={screenings:0,qualified:0,placements:0,findings:0,creatives:0,claims:0,visits:0,tickets:0,score:0};
  o.screenings=INTERACTIONS.filter(function(x){return x.agent===uid}).length;
  o.qualified=CANDIDATES.filter(function(c){return c.assignedTo===uid&&['QUALIFIED','OFFERED','PLACED','ENGAGED','RESOLVED'].indexOf(c.state)>=0}).length;
  o.findings=FINDINGS.filter(function(f){return f.adjudicatedBy===uid}).length;
  o.creatives=CREATIVES.filter(function(c){return c.responsible&&false}).length;
  o.claims=PD_CLAIMS.filter(function(c){return c.owner===uid}).length;
  o.visits=AFFILIATES.filter(function(a){var r=routeById(a.route);return r&&r.rep===uid}).length;
  o.tickets=0;
  o.score=Math.min(100,o.screenings*1.6+o.qualified*3.4+o.findings*4+o.claims*2.4+o.visits*1.1);
  return o;
}

/* ---------------- LEDGER EVENTS (derived) ---------------- */
var LEDGER=[];
(function(){
  var seq=41000;
  function ev(type,stream,at,actor,payload,jur){
    LEDGER.push({id:'EV-'+(seq++),type:type,stream:stream,at:at,actor:actor,payload:payload,
      jur:jur||'GA',hash:Math.floor(RNG()*0xfffffff).toString(16).padStart(7,'0')+'…'+Math.floor(RNG()*0xffff).toString(16).padStart(4,'0')});
  }
  CANDIDATES.slice(0,60).forEach(function(c){
    ev('SessionStarted',c.id,c.created-4*6e4,'system','source='+c.source);
    ev('ConsentCaptured',c.id,c.consentAt,'system','disclosure='+c.consentVer+' method='+c.consentMethod);
    ev('ProvenanceEvaluated',c.id,c.consentAt+2000,'system',(c.complianceState==='FROZEN'?'BLOCKED':'PASS')+' rulepack=GA 2026.3.0');
    ev('MatterCandidateCreated',c.id,c.consentAt+3000,'system','county='+c.county+' type='+c.caseType);
    if(c.groupId)ev('GroupMemberLinked',c.id,c.consentAt+4000,'system','group='+c.groupId+' role='+(c.groupRole||'MEMBER'));
    if(['SCREENING','QUALIFIED','NURTURE','DECLINED','OFFERED','PLACED','ENGAGED','RESOLVED'].indexOf(c.state)>=0)
      ev('ScreeningStarted',c.id,c.created+rr(2,50)*6e4,c.assignedTo,'path=GA-'+c.caseType+' v6');
    if(['QUALIFIED','OFFERED','PLACED','ENGAGED','RESOLVED'].indexOf(c.state)>=0)
      ev('MatterCandidateQualified',c.id,c.created+rr(20,90)*6e4,c.assignedTo,'score='+c.score);
    if(c.firm){
      ev('PlacementOffered',c.id,c.created+rr(90,140)*6e4,'system','firm='+c.firm+' allocator=v3.2');
      ev('PlacementAccepted',c.id,c.created+rr(145,200)*6e4,'x.rivera','firm='+c.firm);
    }
    if(c.state==='ENGAGED'||c.state==='RESOLVED') ev('EngagementConfirmed',c.id,c.engagedAt,'x.rivera','retainer signed');
    if(c.state==='RESOLVED') ev('MatterResolved',c.id,c.resolvedAt,'x.rivera','band='+c.band);
  });
  GROUPS.forEach(function(g){
    ev('GroupCaseOpened',g.id,g.opened,'system','members='+g.members.length+' county='+g.county);
    if(g.conflictChecked)ev('GroupConflictCleared',g.id,g.opened+36e5,'u.nunez','all members checked against firm watchlists');
    if(g.firm)ev('GroupPlacementConfirmed',g.id,g.opened+8*36e5,'system','firm='+g.firm);
  });
  FINDINGS.forEach(function(f){ ev('FindingRaised',f.subject,f.detected,f.detector==='SPOT_CHECK'?'u.hayes':'system',f.sev+' '+f.cat); });
  CONTRIBUTIONS.filter(function(c){return c.status==='POSTED'}).forEach(function(c){
    ev('ContributionReceived',c.firm,c.received,'u.raghavan',usd(c.amount)+' via '+c.method);
  });
  CREATIVES.filter(function(c){return c.status.indexOf('APPROVED')===0}).slice(0,18).forEach(function(c){
    ev('CreativeApproved',c.id,c.submitted+rr(1,10)*36e5,'u.nunez','responsible='+(c.responsible||'—'));
  });
  PD_CLAIMS.slice(0,20).forEach(function(c){
    ev('PropertyDamageClaimOpened',c.id,c.opened,c.owner,'carrier='+c.carrier+' vehicle='+c.vehicle);
    if(c.settled)ev('PropertyDamageClaimSettled',c.id,c.opened+rr(20,80)*DAY,c.owner,usd(c.settled));
  });
  HANDOUTS.slice(0,14).forEach(function(h){
    ev('MaterialsHandedOver',h.to,h.at,h.by,h.qty+' units of '+h.item+(h.signed?' (signed)':' (unsigned)'));
  });
  LEDGER.sort(function(a,b){return b.at-a.at});
})();

/* ---------------- DERIVED KPIs (single source of truth) ---------------- */
var KPI={};
function computeKPI(){
  var K={};
  K.total=CANDIDATES.length;
  K.byState={}; STATES.forEach(function(s){K.byState[s.k]=CANDIDATES.filter(function(c){return c.state===s.k}).length});
  K.engaged=CANDIDATES.filter(function(c){return c.state==='ENGAGED'||c.state==='RESOLVED'}).length;
  K.placed=CANDIDATES.filter(function(c){return ['PLACED','ENGAGED','RESOLVED'].indexOf(c.state)>=0}).length;
  K.qualified=CANDIDATES.filter(function(c){return ['QUALIFIED','OFFERED','PLACED','ENGAGED','RESOLVED'].indexOf(c.state)>=0}).length;
  K.frozen=CANDIDATES.filter(function(c){return c.complianceState==='FROZEN'}).length;
  K.attestedSpend=ALLOCATIONS.filter(function(a){return a.attested}).reduce(function(s,a){return s+a.amount},0);
  K.contributed=OBLIGATIONS.reduce(function(s,o){return s+o.contributed},0);
  K.committedNow=OBLIGATIONS.filter(function(o){return o.monthsAgo===0}).reduce(function(s,o){return s+o.committed},0);
  K.deliveredNow=OBLIGATIONS.filter(function(o){return o.monthsAgo===0}).reduce(function(s,o){return s+o.delivered},0);
  K.carry=OBLIGATIONS.reduce(function(s,o){return s+o.carry},0);
  K.emPer1k=K.attestedSpend?(K.engaged/(K.attestedSpend/1000)):0;
  K.onPace=FIRMS.filter(function(f){var o=firmObl(f.id,0);return o&&Math.abs(o.variance)<=15}).length;
  K.firmsActive=FIRMS.filter(function(f){return f.status!=='TERMINATED'}).length;
  var ttf=CANDIDATES.filter(function(c){return c.firstContactSec>0}).map(function(c){return c.firstContactSec}).sort(function(a,b){return a-b});
  K.ttfP50=ttf.length?ttf[Math.floor(ttf.length*0.5)]:0;
  K.ttfP90=ttf.length?ttf[Math.floor(ttf.length*0.9)]:0;
  K.openFind=FINDINGS.filter(function(f){return f.status==='OPEN'});
  K.sev1=K.openFind.filter(function(f){return f.sev==='SEV1'}).length;
  K.sev2=K.openFind.filter(function(f){return f.sev==='SEV2'}).length;
  K.breached=K.openFind.filter(function(f){return f.due<NOW}).length;
  K.reviewCoverage=100;
  K.pendingCreative=CREATIVES.filter(function(c){return c.status==='SUBMITTED'||c.status==='IN_REVIEW'}).length;
  K.pendingContrib=CONTRIBUTIONS.filter(function(c){return c.status==='PENDING'}).length;
  K.solRisk=CANDIDATES.filter(function(c){return c.sol-NOW<90*DAY&&['DECLINED','RESOLVED','ENGAGED'].indexOf(c.state)<0}).length;
  K.blownClocks=CANDIDATES.filter(function(c){return c.state==='OFFERED'&&c.clockEnds<NOW}).length;
  K.atRisk=FIRMS.filter(function(f){return f.status==='AT_RISK'||f.trust<62}).length;
  K.hrOverdue=PEOPLE_ITEMS.filter(function(i){return i.status==='OVERDUE'}).length;
  K.payoutsDue=FLIGHTS.filter(function(f){return f.status==='ACTIVE'&&f.delivered>=f.deliverables}).length;

  /* ---- group cases ---- */
  K.groups=GROUPS.length;
  K.groupClaimants=GROUPS.reduce(function(s,g){return s+g.members.length},0);
  K.groupEngaged=GROUPS.reduce(function(s,g){return s+g.engaged},0);
  K.groupUnplaced=GROUPS.filter(function(g){return !g.firm}).length;
  K.groupConflictOpen=GROUPS.filter(function(g){return !g.conflictChecked}).length;
  K.groupGuardianGap=GROUPS.filter(function(g){return g.guardianRequired&&g.guardianOnFile<g.members.length}).length;

  /* ---- property damage ---- */
  K.pdOpen=PD_CLAIMS.filter(function(c){return ['SETTLED','CLOSED'].indexOf(c.stage)<0}).length;
  K.pdTotalLoss=PD_CLAIMS.filter(function(c){return c.stage==='TOTAL_LOSS'}).length;
  K.pdStorage=PD_CLAIMS.filter(function(c){return c.storage}).reduce(function(s,c){
    var f=STORAGE_FACILITIES.filter(function(x){return x.id===c.storage})[0];
    return s+(f?f.daily*c.storageDays:0)},0);
  K.pdStale=PD_CLAIMS.filter(function(c){return ['SETTLED','CLOSED'].indexOf(c.stage)<0&&NOW-c.lastTouch>7*DAY}).length;
  K.pdSettled=PD_CLAIMS.filter(function(c){return c.settled}).reduce(function(s,c){return s+c.settled},0);
  K.pdLinked=PD_CLAIMS.filter(function(c){return c.candidate}).length;

  /* ---- routes ---- */
  K.routeStops=AFFILIATES.filter(function(a){return a.eligible}).length;
  K.routeAnchors=AFFILIATES.filter(function(a){return a.tier==='ANCHOR'}).length;
  K.routeStale=AFFILIATES.filter(function(a){return a.eligible&&NOW-a.lastVisit>35*DAY}).length;
  K.routeReferrals=AFFILIATES.reduce(function(s,a){return s+a.referrals90},0);
  K.routeStipend=AFFILIATES.reduce(function(s,a){return s+a.stipend},0);
  K.routeCoverage=ROUTES.length?Math.round(ROUTES.reduce(function(s,r){return s+r.coverage},0)/ROUTES.length*100):0;
  K.routeIneligible=AFFILIATES.filter(function(a){return !a.eligible}).length;

  /* ---- fleet / assets / inventory ---- */
  K.fleetTotal=FLEET.length;
  K.fleetIssues=FLEET.filter(function(v){return v.status==='SERVICE DUE'||v.status==='GROUNDED'}).length;
  K.fleetMiles=FLEET.reduce(function(s,v){return s+v.milesMTD},0);
  K.fleetFuel=FLEET.reduce(function(s,v){return s+v.fuelMTD},0);
  K.assetTotal=ASSETS.length;
  K.assetValue=ASSETS.reduce(function(s,a){return s+a.value},0);
  K.assetIssues=ASSETS.filter(function(a){return a.status==='OVERDUE RETURN'||a.status==='IN REPAIR'||a.condition==='NEEDS REPAIR'}).length;
  K.assetSpare=ASSETS.filter(function(a){return a.status==='SPARE'}).length;
  K.invValue=INVENTORY.reduce(function(s,i){return s+i.value},0);
  K.invLow=INVENTORY.filter(function(i){return i.status!=='IN STOCK'}).length;
  K.invOut=INVENTORY.filter(function(i){return i.status==='OUT OF STOCK'}).length;

  /* ---- workforce ---- */
  var sums=TRACKED.map(function(p){return actSummary(p.id,7)});
  var withTime=sums.filter(function(s){return s.tracked>0});
  K.wfTracked=withTime.length;
  K.wfHours=Math.round(sums.reduce(function(s,x){return s+x.tracked},0)/60);
  K.wfUtil=withTime.length?Math.round(withTime.reduce(function(s,x){return s+x.util},0)/withTime.length):0;
  K.wfFocus=withTime.length?Math.round(withTime.reduce(function(s,x){return s+x.focus},0)/withTime.length):0;
  K.wfPI=withTime.length?Math.round(withTime.reduce(function(s,x){return s+x.pi},0)/withTime.length):0;
  K.wfFlags=sums.reduce(function(s,x){return s+x.flags},0);
  K.wfShots=SCREENSHOTS.length;
  K.wfTimesheetOpen=TIMESHEETS.filter(function(t){return !t.approved}).length;

  /* ---- forms / ITSM / production ---- */
  K.formsLive=FORMS.filter(function(f){return f.status==='LIVE'}).length;
  K.formsSubs=FORMS.reduce(function(s,f){return s+f.subs},0);
  K.formsOpen=FORMS.reduce(function(s,f){return s+f.open},0);
  K.itOpen=IT_TICKETS.filter(function(t){return ['RESOLVED','CLOSED'].indexOf(t.status)<0}).length;
  K.itP1=IT_TICKETS.filter(function(t){return t.pri==='P1'&&['RESOLVED','CLOSED'].indexOf(t.status)<0}).length;
  K.changesOpen=CHANGES.filter(function(c){return c.status==='IN REVIEW'}).length;
  K.mediaOpen=MEDIA_PROJECTS.filter(function(m){return ['PUBLISHED','APPROVED'].indexOf(m.stage)<0}).length;
  K.mediaLate=MEDIA_PROJECTS.filter(function(m){return ['PUBLISHED','APPROVED'].indexOf(m.stage)<0&&m.due<NOW}).length;

  /* ---- Compliance Posture Index ---- */
  var cpi=100;
  cpi-=40*(K.sev1>0?1:0);
  cpi-=10*K.openFind.filter(function(f){return f.sev==='SEV2'&&f.due<NOW}).length;
  cpi-=3*K.openFind.filter(function(f){return f.sev==='SEV3'&&f.due<NOW}).length;
  cpi-=RULEPACKS.some(function(r){return r.status==='ACTIVE'&&NOW-r.from>90*DAY})?10:0;
  cpi-=OBLIGATIONS.some(function(o){return o.monthsAgo===1&&!o.attested})?10:0;
  K.cpi=Math.max(0,Math.round(cpi));
  K.posture=K.cpi>=90?'GREEN':K.cpi>=70?'AMBER':'RED';
  K.forecastP50=Math.min(100,Math.round(K.committedNow?K.deliveredNow/K.committedNow*100*1.09:0));
  K.forecastP10=Math.round(K.forecastP50*0.83);
  K.fundVelocity=41;
  K.channels=SOURCES.map(function(s){
    var mine=CANDIDATES.filter(function(c){return c.source===s.id});
    var eng=mine.filter(function(c){return c.state==='ENGAGED'||c.state==='RESOLVED'}).length;
    var chSpend=Math.round(K.attestedSpend*(s.w/100));
    return {id:s.id,name:s.n,ch:s.ch,cands:mine.length,engaged:eng,spend:chSpend,
      cpe:eng?Math.round(chSpend/eng):0,deterministic:s.w,
      multitouch:Math.max(1,Math.round(s.w*(0.6+RNG()*0.9))),self:Math.max(1,Math.round(s.w*(0.5+RNG()*1.2)))};
  }).sort(function(a,b){return b.cands-a.cands});
  return K;
}
KPI=computeKPI();
function recomputeKPI(){KPI=computeKPI()}

  thread:'ch.exec',ddOpen:null,lang:'en',day:0,wfUser:null,tool:'trim'};
function me(){return person(ROLES[state.role].user)}
function meId(){return ROLES[state.role].user}
function isExt(){return !!ROLES[state.role].ext}
function isExec(){return ROLES[state.role].dept==='Executive'}
function roleHome(){return ROLES[state.role].home}
function navViews(){var o=[],seen={};ROLES[state.role].groups.forEach(function(g){g.items.forEach(function(i){if(!seen[i.v]){seen[i.v]=1;o.push(i)}})});return o}
function canSee(v){return navViews().some(function(i){return i.v===v})}

/* ==========================================================================
   ATTENTION FEED — role-specific "My day"
   ========================================================================== */
function attention(){
  var r=state.role, dept=ROLES[r].dept, out=[];
  function A(sev,t,d,view,act,arg){out.push({sev:sev,t:t,d:d,view:view,act:act,arg:arg})}
  var exec=isExec();
  var hero=CANDIDATES.filter(function(c){return c.state==='OFFERED'&&c.clockEnds<NOW})[0];
  var sev1=KPI.openFind.filter(function(f){return f.sev==='SEV1'});
  var breached=KPI.openFind.filter(function(f){return f.due<NOW});

  if(exec||dept==='Compliance'||dept==='Intake')
    sev1.forEach(function(f){A('stop','Open Sev-1 — '+f.cat.replace(/_/g,' '),f.excerpt+' · due '+frel(f.due),'findings','open-finding',f.id)});
  if(exec||dept==='Compliance')
    breached.filter(function(f){return f.sev!=='SEV1'}).slice(0,2).forEach(function(f){A('warn','Finding past SLA — '+f.sev,f.excerpt,'findings','open-finding',f.id)});
  if(KPI.groupConflictOpen&&(exec||dept==='Compliance'||dept==='Intake'))
    GROUPS.filter(function(g){return !g.conflictChecked}).forEach(function(g){
      A('stop','Group conflict check outstanding — '+g.name,g.members.length+' claimants · one missed conflict on a group is '+g.members.length+' errors, not one','groups','open-group',g.id)});
  if(KPI.groupGuardianGap&&(exec||dept==='Compliance'||dept==='Intake'))
    GROUPS.filter(function(g){return g.guardianRequired&&g.guardianOnFile<g.members.length}).forEach(function(g){
      A('warn','Guardian consent missing — '+g.name,(g.members.length-g.guardianOnFile)+' minors without a guardian artifact · contact is blocked','groups','open-group',g.id)});
  if(hero&&(exec||['Intake','Sales'].indexOf(dept)>=0))
    A('stop','Shot clock expired — '+hero.name,'Offered to '+((FIRMS.filter(function(f){return f.id===hero.offerFirm})[0])||{}).name+' · expired '+frel(hero.clockEnds)+' · score '+hero.score,'placement','open-cand',hero.id);
  if(dept==='Intake'||exec){
    var sol=CANDIDATES.filter(function(c){return c.sol-NOW<90*DAY&&['DECLINED','RESOLVED'].indexOf(c.state)<0}).sort(function(a,b){return a.sol-b.sol})[0];
    if(sol)A('warn','Statute expires in '+Math.round((sol.sol-NOW)/DAY)+' days',sol.id+' — '+sol.name+' · '+caseName(sol.caseType)+' · still in '+sol.state,'pipeline','open-cand',sol.id);
  }
  if(exec||dept==='Sales')
    FIRMS.filter(function(f){return f.status==='AT_RISK'||f.trust<62}).forEach(function(f){
      A('warn','Firm at risk — '+f.name,'Trust '+f.trust+' · acceptance '+pct(f.acceptRate,1)+' · median response '+f.medianResp+'m','firms','open-firm',f.id)});
  if(r==='cfo'||exec)
    CONTRIBUTIONS.filter(function(c){return c.status==='PENDING'}).slice(0,2).forEach(function(c){
      A('warn','Contribution pending posting — '+(FIRMS.filter(function(x){return x.id===c.firm})[0]||{}).name,
        usd(c.amount)+' via '+c.method+' · awaiting bank confirmation','capital','post-contribution',c.id)});
  if(dept==='Marketing'||exec)
    CREATIVES.filter(function(c){return c.status==='SUBMITTED'||c.status==='IN_REVIEW'}).slice(0,3).forEach(function(c){
      A(c.status==='IN_REVIEW'?'warn':'info','Awaiting review — '+c.title,
        (c.origin==='CREATOR'?((creator(c.creator)||{}).name||'')+' · ':'')+c.type+' · submitted '+frel(c.submitted),'review','open-creative',c.id)});
  if(r==='producer'||r==='creator_ops'||r==='cmo')
    MEDIA_PROJECTS.filter(function(m){return ['PUBLISHED','APPROVED'].indexOf(m.stage)<0&&m.due<NOW}).slice(0,3).forEach(function(m){
      A('warn','Production past due — '+m.title,m.stage.toLowerCase()+' · '+person(m.owner).name+' · due '+frel(m.due)+' · '+m.revisions+' revisions','production','open-media',m.id)});
  if(dept==='Claims Operations'||exec){
    PD_CLAIMS.filter(function(c){return c.note&&['SETTLED','CLOSED'].indexOf(c.stage)<0}).slice(0,3).forEach(function(c){
      A(c.storageDays>30?'stop':'warn','Claim needs attention — '+c.id,c.note,'pdclaims','open-pd',c.id)});
  }
  if(dept==='Routes'||exec){
    if(KPI.invOut)A('warn','Materials out of stock',KPI.invOut+' line(s) at zero and '+KPI.invLow+' below reorder — anchor stops this week have nothing to leave behind','inventory','nav','inventory');
    ACTIVATIONS.filter(function(a){return a.status!=='COMPLETED'&&a.staffed<a.staffNeeded}).forEach(function(a){
      A('warn','Under-staffed activation — '+a.name,a.staffed+' of '+a.staffNeeded+' staffed · '+a.briefAck+' brief acknowledgements · '+frel(a.when),'activations','open-activation',a.id)});
    if(KPI.routeStale)A('info',KPI.routeStale+' affiliates not visited in 35 days','Coverage is at '+KPI.routeCoverage+'% across '+ROUTES.length+' routes','routes','nav','routes');
  }
  if(r==='office_mgr'||r==='coo'){
    FLEET.filter(function(v){return v.status!=='IN SERVICE'&&v.status!=='AVAILABLE'}).forEach(function(v){
      A(v.status==='GROUNDED'?'stop':'warn','Vehicle '+v.status.toLowerCase()+' — '+v.label,v.note||(v.make+' · '+v.plate+' · odometer '+v.odometer.toLocaleString()),'fleet','open-vehicle',v.id)});
    ASSETS.filter(function(a){return a.status==='OVERDUE RETURN'}).forEach(function(a){
      A('warn','Asset not returned — '+a.model,a.note||'Assigned device still enrolled after offboarding','assets','open-asset',a.id)});
  }
  if(dept==='Technology'||r==='cto')
    IT_TICKETS.filter(function(t){return t.pri==='P1'&&['RESOLVED','CLOSED'].indexOf(t.status)<0}).forEach(function(t){
      A('stop','P1 ticket open — '+t.subject,person(t.by).name+' · '+t.cat+' · '+frel(t.opened),'itsm','open-ticket',t.id)});
  if(dept==='People'||exec)
    PEOPLE_ITEMS.filter(function(i){return i.status==='OVERDUE'}).forEach(function(i){
      A('stop','Overdue — '+i.t,i.type+' · '+person(i.owner).name+' · due '+frel(i.due),'people','open-hr',i.id)});
  if(KPI.wfTimesheetOpen&&(r==='routes_mgr'||r==='hr_mgr'||r==='coo'))
    A('info',KPI.wfTimesheetOpen+' timesheets awaiting approval','Ambassador activity logs · payroll cut-off is in two days','workforce','nav','workforce');
  if(r==='intake_spec'||r==='claims_rep'||r==='routes_rep'||r==='hr_rep'||r==='producer'){
    CANDIDATES.filter(function(c){return c.assignedTo===meId()&&['SCREENING','ELIGIBLE','RECEIVED'].indexOf(c.state)>=0}).slice(0,4).forEach(function(c){
      A('info','Screening in progress — '+c.name,caseName(c.caseType)+' · '+c.county+' · '+(c.lang==='es'?'Spanish':'English'),'consola','open-consola',c.id)});
    PD_CLAIMS.filter(function(c){return c.owner===meId()&&['SETTLED','CLOSED'].indexOf(c.stage)<0}).slice(0,3).forEach(function(c){
      A('info','Open claim — '+c.id,c.vehicle+' · '+c.carrier+' · '+c.stage.replace(/_/g,' ').toLowerCase(),'pdclaims','open-pd',c.id)});
    MEDIA_PROJECTS.filter(function(m){return m.owner===meId()&&['PUBLISHED','APPROVED'].indexOf(m.stage)<0}).slice(0,3).forEach(function(m){
      A('info','In production — '+m.title,m.stage.toLowerCase()+' · due '+frel(m.due),'production','open-media',m.id)});
  }
  if(r==='attorney'){
    CANDIDATES.filter(function(c){return c.state==='OFFERED'&&c.offerFirm==='F01'}).forEach(function(c){
      A(c.clockEnds<NOW?'stop':'warn','Offer '+(c.clockEnds<NOW?'expired':'awaiting response')+' — '+caseName(c.caseType),
        c.county+' County · '+(c.lang==='es'?'Spanish-speaking':'English')+' · '+(c.clockEnds<NOW?'expired '+frel(c.clockEnds):frel(c.clockEnds)),'offers','open-cand',c.id)});

      A('info','Group case with your firm — '+g.name,g.members.length+' claimants · '+g.engaged+' engaged · shared statute clock','groups','open-group',g.id)});
  }
  if(r==='creator'){
    CREATIVES.filter(function(c){return c.creator==='C1'&&(c.status==='IN_REVIEW'||c.status==='SUBMITTED')}).forEach(function(c){

    A('info','3 approved themes this week','T1, T2 and T5 are available to record','studio','nav','studio');
  }
  return out;
}

VIEWS.calendar={title:'Calendar',render:function(){
  var mode=state.sub||'month';
  var scope=state.mode==='all'?null:meId();

    'Meetings, shifts, route days, activations, statute deadlines and service dates in one place. Statute deadlines are pulled from the matter records, not typed in.',

    return '<span class="chip"><i style="width:8px;height:8px;border-radius:2px;background:var(--'+

      esc(k.toLowerCase())+' <b class="mono">'+counts[k]+'</b></span>';

  if(mode==='agenda'){

      '<button class="btn pri" data-act="new-event">New event</button>');
    var byDay={};
    list.forEach(function(e){var k=fdate(e.at);(byDay[k]=byDay[k]||[]).push(e)});
    h+=Object.keys(byDay).map(function(d){
      return sechead(d,'<span class="pill p-neutral">'+byDay[d].length+'</span>')+
        '<div class="card pad0">'+byDay[d].map(function(e){return agendaRow(e)}).join('')+'</div>';
    }).join('');
    return h;
  }
  if(mode==='week'){
    h+='<div class="daystrip" style="margin-bottom:12px">'+[0,1,2,3,4,5,6].map(function(d){
      var dt=new Date(NOW); dt.setDate(dt.getDate()+d);
      var n=calFor(scope,d,d).length;
      return '<button class="'+(state.day===d?'on':'')+'" data-act="cal-day" data-arg="'+d+'">'+
        '<div class="dw">'+dt.toLocaleDateString('en-US',{weekday:'short'})+'</div>'+
        '<div class="dd">'+dt.getDate()+'</div>'+(n?'<div class="dt"></div>':'')+'</button>';
    }).join('')+'</div>';
    var day=calFor(scope,state.day,state.day);
    var dd=new Date(NOW); dd.setDate(dd.getDate()+state.day);
    h+=sechead(dd.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}),
      '<span class="pill p-neutral">'+day.length+'</span>');
    h+='<div class="card pad0">'+(day.length?day.map(function(e){return agendaRow(e)}).join('')
      :empty('▦','Nothing on this day','Pick another day above, or switch the scope to everyone.',''))+'</div>';
    return h;
  }
  /* month grid */
  var first=new Date(NOW); first.setDate(1); first.setHours(0,0,0,0);
  var startPad=first.getDay();
  var monthStart=first.getTime();
  var todayN=new Date(NOW).getDate();
  h+='<div class="cal">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){return '<div class="dh">'+d+'</div>'}).join('');

    var inMonth=cell.getMonth()===first.getMonth();

    var evs=calFor(scope,offset,offset);
    h+='<button class="dc'+(inMonth?'':' off')+(inMonth&&cell.getDate()===todayN?' today':'')+'" data-act="cal-jump" data-arg="'+offset+'">'+
      '<span class="dn">'+cell.getDate()+'</span>'+
      evs.slice(0,3).map(function(e){return '<span class="ev '+(CAL_KINDS[e.kind]||'')+'">'+esc(e.title)+'</span>'}).join('')+
      (evs.length>3?'<span class="cap" style="font-size:9.5px">+'+(evs.length-3)+' more</span>':'')+'</button>';
  }
  h+='</div>';
  h+='<p class="cap" style="margin-top:10px">Click any day to open it in week view. Statute-expiry entries are derived from matter records — they cannot be deleted from the calendar, only resolved on the matter.</p>';
  return h;
}};

var PIPE_COLS=[
 {k:'RECEIVED',n:'Received',c:'var(--info)'},{k:'ELIGIBLE',n:'Eligible',c:'var(--info)'},
 {k:'SCREENING',n:'Screening',c:'var(--y)'},{k:'QUALIFIED',n:'Qualified',c:'var(--y)'},
 {k:'OFFERED',n:'Offered',c:'var(--yp)'},{k:'PLACED',n:'Placed',c:'var(--ok)'},

 {k:'RESOLVED',n:'Resolved',c:'var(--tt)'}

function pipeScope(){
  var r=state.role, pool=CANDIDATES, note='Every matter candidate across the Georgia network.';
  if(r==='intake_spec'){pool=CANDIDATES.filter(function(c){return c.assignedTo===meId()});
    note='Scoped to your own records — the candidates you personally handled or hold in queue.'}
  if(r==='routes_mgr'||r==='routes_rep'){pool=CANDIDATES.filter(function(c){return c.sourceClass==='FIELD_ACTIVATION'});
    note='Scoped to field captures. Every one was entered by the claimant on a handed-over device.'}
  if(r==='sales_rep'){pool=CANDIDATES.filter(function(c){return ['QUALIFIED','OFFERED','PLACED','ENGAGED'].indexOf(c.state)>=0});
    note='Qualified and beyond — the matters your firms can actually act on.'}
  return {pool:pool,note:note};
}

  var g=groupOf(c);

    '<div class="t trunc">'+esc(c.name)+'</div>'+

    '<div class="f">'+langChip(c.lang)+

    (g?'<span class="chip" title="Group case">⧉ '+esc(g.id)+'</span>':'')+

    }).join('')+'</div>';
    if(filtered.length>50)h+='<p class="cap" style="margin-top:8px">Showing the first 50 of '+filtered.length+'.</p>';
    return h;
  }
  if(mode==='timeline'){
    var sorted=filtered.slice().sort(function(a,b){return a.sol-b.sol}).slice(0,26);
    var minS=sorted[0].sol, maxS=sorted[sorted.length-1].sol, span=Math.max(1,maxS-minS);

      sorted.map(function(c){
        var d=Math.round((c.sol-NOW)/DAY);
        var w=Math.max(2,Math.min(100,(c.sol-minS)/span*100));
        return '<button style="display:block;width:100%;text-align:left;padding:6px 0" data-act="open-cand" data-arg="'+c.id+'">'+
          '<div class="rowb" style="margin-bottom:3px"><span class="trunc" style="font-size:12.5px">'+esc(c.name)+

          '<span class="mono cap '+(d<90?'neg':'')+'">'+d+'d · '+fshort(c.sol)+'</span></div>'+
          meter(w,100,d<45?'stop':d<180?'warn':'ok')+'</button>';
      }).join('')+'</div>';
    return h;
  }
  /* table */
  h+=table([{h:'Candidate'},{h:'Case type'},{h:'County'},{h:'Group'},{h:'Source'},{h:'Assigned'},{h:'State'},{h:'Score',num:true},{h:'SOL'},{h:'Created'}],
    filtered.slice(0,60).map(function(c){

        '<b>'+esc(c.name)+'</b> '+langChip(c.lang)+'<div class="cap mono">'+c.id+'</div>',
        caseName(c.caseType),c.county,

        '<span class="cap">'+esc(srcById(c.source).ch)+'</span>',
        '<span class="cap">'+esc(person(c.assignedTo).name)+'</span>',
        pillFor(c.state),String(c.score),

        frel(c.created)]};
    }));
  if(filtered.length>60)h+='<p class="cap" style="margin-top:8px">Showing the first 60 of '+filtered.length+' records.</p>';
  return h;
}};

function threadFor(id){
  if(THREADS[id])return THREADS[id];
  for(var i=0;i<DMS.length;i++)if(DMS[i].id===id)return DMS[i].msgs;
  return null;
}
function threadTitle(id){
  for(var i=0;i<CHANNELS.length;i++)if(CHANNELS[i].id===id)return '#'+CHANNELS[i].name;
  for(var j=0;j<DMS.length;j++)if(DMS[j].id===id)return person(DMS[j].with).name;
  return id;
}
function threadTopic(id){
  for(var i=0;i<CHANNELS.length;i++)if(CHANNELS[i].id===id)return CHANNELS[i].topic;
  for(var j=0;j<DMS.length;j++)if(DMS[j].id===id)return person(DMS[j].with).title;
  return '';
}

/* ---------------- WORKFORCE ACTIVITY & PRODUCTIVITY ---------------- */
function catBar(a){
  return stack([[a.core,'var(--ok)','core system work'],[a.comms,'var(--y)','calls & messaging'],
    [a.docs,'var(--info)','documents & research'],[a.other,'var(--warn)','uncategorized'],[a.idle,'var(--s3)','idle']]);
}
function dayStrip(uid){
  var rows=actFor(uid,14).slice().sort(function(a,b){return b.daysAgo-a.daysAgo});
  var mx=Math.max.apply(null,rows.map(function(r){return r.tracked}))||1;
  return '<span class="hbar">'+rows.map(function(r){
    var cls=!r.tracked?'d':r.util>=75?'a':r.util>=55?'b':'c';
    return '<i class="'+cls+'" style="height:'+Math.max(6,r.tracked/mx*100)+'%" title="'+r.daysAgo+'d ago"></i>';
  }).join('')+'</span>';
}
function wfPolicyCard(){
  return '<div class="card evi" style="margin-bottom:14px"><div class="label">Monitoring policy — what is and is not captured</div>'+
   '<div class="grid g2" style="margin-top:10px">'+
   '<div><div class="cap" style="color:var(--ok);font-weight:600;margin-bottom:5px">Captured, with notice and written consent</div>'+
   '<ul class="cap" style="margin:0 0 0 16px;line-height:1.8">'+
   ['Active versus idle minutes inside the working window staff themselves start and stop',
    'Which application category is in the foreground, never the content inside it',
    'Blurred periodic screenshots at roughly ten-minute intervals, retained 30 days',
    'Aggregate keyboard and pointer counts, never keystrokes'].map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'+
   '<div><div class="cap" style="color:var(--stop);font-weight:600;margin-bottom:5px">Never captured</div>'+
   '<ul class="cap" style="margin:0 0 0 16px;line-height:1.8">'+
   ['Keystroke content, message bodies, passwords or clipboard contents',
    'Anything outside the shift window, including personal devices',
    'Camera, microphone or location beyond a route check-in the person initiates',
    'Screenshots of claimant records at readable resolution — those are blurred at capture'].map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div></div>'+
   '<p class="cap" style="margin-top:11px">The productivity index exists to start a conversation, not to end one. It is a team-level operating signal; using it alone as a disciplinary instrument is a policy violation, not a management style. Staff can see everything their manager sees about them, on this same screen. '+cite('Internal WF-1')+'</p></div>';
}

function openModal(html){
  var s=document.getElementById('scrim'), host=document.getElementById('modalhost');
  if(!s||!host)return; host.innerHTML=html; s.classList.add('on');
  var fi=host.querySelector('input,textarea,select'); if(fi&&fi.focus)fi.focus();
}
function closeModal(){var s=document.getElementById('scrim');if(s)s.classList.remove('on');}
function modal(title,body,foot,wide){
  return '<div class="modal'+(wide?' wide':'')+'"><div class="mhead"><h2>'+title+'</h2>'+
    '<button class="x" data-act="close-modal">×</button></div><div class="mbody">'+body+'</div>'+
    (foot?'<div class="mfoot">'+foot+'</div>':'')+'</div>';
}
function formModal(title,intro,fields,submitAct,submitLabel){
  return modal(esc(title),
    '<p class="cap" style="margin-bottom:14px">'+esc(intro)+'</p>'+
    fields.map(function(f){
      if(f.type==='select')return '<div class="field"><label>'+esc(f.l)+'</label><select data-f="'+esc(f.k)+'">'+
        f.opts.map(function(o){return '<option>'+esc(o)+'</option>'}).join('')+'</select>'+(f.h?'<div class="hint">'+esc(f.h)+'</div>':'')+'</div>';
      if(f.type==='textarea')return '<div class="field"><label>'+esc(f.l)+'</label><textarea data-f="'+esc(f.k)+'" placeholder="'+esc(f.p||'')+'"></textarea>'+(f.h?'<div class="hint">'+esc(f.h)+'</div>':'')+'</div>';
      return '<div class="field"><label>'+esc(f.l)+'</label><input data-f="'+esc(f.k)+'" placeholder="'+esc(f.p||'')+'" value="'+esc(f.v||'')+'">'+(f.h?'<div class="hint">'+esc(f.h)+'</div>':'')+'</div>';
    }).join(''),
    '<button class="btn" data-act="close-modal">Cancel</button>'+
    '<button class="btn pri" data-act="'+submitAct+'">'+esc(submitLabel||'Submit')+'</button>');
}
function readForm(){
  var host=document.getElementById('modalhost'); var out={};
  if(!host||!host.querySelectorAll)return out;
  var els=host.querySelectorAll('[data-f]');
  for(var i=0;i<els.length;i++){out[els[i].getAttribute('data-f')]=els[i].value||''}
  return out;
}

function toast(title,body,tone,sim){
  var host=document.getElementById('toasts'); if(!host)return;
  var el=document.createElement('div');
  el.className='toast '+(tone||'');
  el.innerHTML='<b>'+esc(title)+'</b><span>'+esc(body||'')+'</span>'+
    (sim===false?'':'<span class="sim">demo — clears on reload</span>');
  host.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},5200);
}

function bestFirm(c,exclude){
  var pool=FIRMS.filter(function(f){
    return !f.paused && f.id!==exclude && f.territories.indexOf(c.county)>=0 && f.caseTypes.indexOf(c.caseType)>=0;
  });
  if(!pool.length)pool=FIRMS.filter(function(f){return !f.paused&&f.id!==exclude});
  return pool.sort(function(a,b){return b.trust-a.trust})[0];
}

/* ---------------- COMMS ---------------- */
ACTIONS['send-msg']=function(a){
  var input=document.getElementById('composer');
  var txt=input&&input.value?String(input.value).trim():'';
  if(!txt)return toast('Nothing to send','Type a message first — Enter sends it.','warn',false);
  var msgs=threadFor(a||state.thread);
  if(!msgs)return;
  msgs.push({from:'__me__',at:Date.now(),text:txt,rx:null});
  if(input)input.value='';
  render();
  logAction('Sent a message in '+threadTitle(a||state.thread));
  var el=document.getElementById('msgs'); if(el&&el.scrollHeight)el.scrollTop=el.scrollHeight;
  toast('Sent',threadTitle(a||state.thread)+' — no backend, so nobody is actually notified.','ok');
};
ACTIONS['react']=function(a){
  var p=String(a).split('|'), msgs=threadFor(p[0]);
  if(!msgs)return; var m=msgs[parseInt(p[1],10)]; if(!m)return;
  m.rx=m.rx||{}; m.rx[p[2]]=(m.rx[p[2]]||0)+1;
  render(); logAction('Reacted '+p[2]+' in '+threadTitle(p[0]));
};

ACTIONS['clear-group-conflict']=function(a){
  var g=group(a); if(!g)return;
  g.conflictChecked=true;
  commit('Conflict check cleared — '+g.id,g.members.length+' claimants checked against every firm watchlist in a single pass. Recorded as one ledger event covering the group.','ok');
};
ACTIONS['place-group']=function(a){
  var g=group(a); if(!g)return;
  if(!g.conflictChecked)return toast('Conflict check first','A group cannot be placed until every member has been checked. The block is deliberate.','stop');
  var lead=cand(g.members[0]);
  var f=bestFirm(lead,null);
  if(!f)return toast('No eligible firm','No firm covers this county and case type with capacity for the whole group.','stop');
  g.firm=f.id; g.status='PARTIALLY PLACED';
  g.members.map(cand).forEach(function(c){
    if(c&&['DECLINED','RESOLVED','ENGAGED'].indexOf(c.state)<0){c.state='PLACED';c.firm=f.id;}
  });
  g.engaged=g.members.map(cand).filter(function(c){return c&&(c.state==='ENGAGED'||c.state==='RESOLVED')}).length;
  commit('Group placed with '+f.name,g.members.length+' claimants moved together. One firm, one conflict check, one statute clock.','ok');
};

/* ==========================================================================
   ROUTER — every view id is dispatched here. The fallback is deliberate:
   the role's home screen, never "whatever was last in the chain".
   ========================================================================== */
function renderView(id){
  var v=VIEWS[id];
  if(!v||!canSee(id)){
    v=VIEWS[roleHome()]||VIEWS.about;
    if(id&&!VIEWS[id])logAction('Unknown view "'+id+'" — fell back to '+roleHome());
  }
  return v.render();
}
function renderNav(){
  var r=ROLES[state.role], h='';
  r.groups.forEach(function(g){
    h+='<div class="navgrp label">'+esc(g.l)+'</div>';
    g.items.forEach(function(i){
      var b=i.b?i.b():null;
      h+='<button class="navitem'+(state.view===i.v?' on':'')+'" data-act="nav" data-arg="'+i.v+'">'+
        '<span class="ico">'+i.i+'</span><span class="grow trunc">'+esc(i.n)+'</span>'+
        (b?'<span class="bdg '+(b.tone||'')+'">'+b.n+'</span>':'')+'</button>';
    });
  });
  var tone=KPI.posture==='GREEN'?'var(--ok)':KPI.posture==='AMBER'?'var(--warn)':'var(--stop)';
  h+='<button class="posture" data-act="nav" data-arg="'+(canSee('posture')?'posture':roleHome())+'">'+
    '<div class="rowb"><span class="row"><span class="dot" style="background:'+tone+'"></span>'+
    '<span class="label" style="color:var(--ts)">Posture</span></span>'+
    '<span class="mono" style="font-size:15px">'+KPI.cpi+'</span></div>'+
    '<div class="cap" style="margin-top:4px">'+KPI.sev1+' Sev-1 · '+KPI.openFind.length+' open · '+KPI.breached+' past SLA</div></button>';
  h+='<div style="padding:12px 10px 0;font-size:10.5px;line-height:1.6;color:var(--tt)">'+
    'Synthetic data · no backend<br><button class="cite" data-act="nav" data-arg="about">What is not real →</button></div>';
  return h;
}

        });
      });

  var bm=document.getElementById('bellmenu');

    if(state.ddOpen==='bell'){
      bm.innerHTML='<div class="ddm" style="min-width:330px"><div class="ddh">Needs '+esc(p.name.split(' ')[0])+' — '+r.dept+'</div>'+
        (items.length?items.map(function(i){
          return '<button data-act="'+esc(i.act)+'" data-arg="'+esc(i.arg||'')+'">'+
            '<div class="row"><span style="color:var(--'+(i.sev==='stop'?'stop':i.sev==='warn'?'warn':'info')+')">●</span>'+
            '<div class="grow" style="min-width:0"><div class="trunc">'+esc(i.t)+'</div><div class="cap trunc">'+esc(i.d)+'</div></div></div></button>';
        }).join(''):'<div style="padding:20px 12px;text-align:center" class="cap">Nothing is waiting on you.</div>')+

    } else bm.innerHTML='';

function render(){
  recomputeKPI();
  var rail=document.getElementById('rail'), main=document.getElementById('main');
  if(rail){rail.innerHTML=renderNav(); rail.className=state.railOpen?'open':''}
  if(main){
    var body;
    try{ body=renderView(state.view); }
    catch(e){
      body=phead('Something went wrong on this screen',
        'The demo caught an error rendering "'+state.view+'" and fell back safely instead of blanking. Details are in the console.','')+
        empty('◈','Screen unavailable',String(e&&e.message||e),
        '<button class="btn pri" data-act="nav" data-arg="'+roleHome()+'">Go to '+esc((VIEWS[roleHome()]||{title:'home'}).title)+'</button>');
      if(typeof console!=='undefined'&&console.error)console.error(e);
    }
    main.innerHTML=body+
      '<footer class="foot">Verdad — Accident Professionals operating platform. '+
      'Interactive demonstration: all data is synthetic and generated from a fixed seed, there is no backend or authentication, '+
      'and every change you make clears on reload. '+
      '<button class="cite" data-act="nav" data-arg="about">What is not real →</button></footer>';
    if(main.scrollTop!==undefined)main.scrollTop=0;
  }
  renderTop();
}

  out.push({t:'Toggle theme',s:'Command',act:'theme',arg:'',k:'⌘'});
  out.push({t:'Change language',s:'Command · Spanish surface is a stub',act:'lang',arg:'',k:'⌘'});
  out.push({t:'Refresh my queue',s:'Command',act:'refresh-queue',arg:'',k:'⌘'});
  out.push({t:'Verify ledger chain integrity',s:'Command',act:'verify-chain',arg:'',k:'⌘'});
  out.push({t:'What is not real',s:'Command · honest demo framing',act:'nav',arg:'about',k:'⌘'});
  CHANNELS.forEach(function(c){out.push({t:'#'+c.name,s:'Channel · '+c.topic,act:'open-thread',arg:c.id,k:'#'})});
  return out;
}
function renderPalette(){
  var list=document.getElementById('plist'); if(!list)return;
  var q=(state.pq||'').toLowerCase();
  var items=paletteItems().filter(function(i){return !q||i.t.toLowerCase().indexOf(q)>=0||i.s.toLowerCase().indexOf(q)>=0});
  if(state.pi>=items.length)state.pi=0;
  list.innerHTML=items.length?items.map(function(i,n){
    return '<button class="pitem'+(n===state.pi?' sel':'')+'" data-act="'+esc(i.act)+'" data-arg="'+esc(i.arg)+'">'+
      '<div class="grow" style="min-width:0"><div class="trunc">'+esc(i.t)+'</div><div class="cap trunc">'+esc(i.s)+'</div></div>'+
      '<span class="k">'+esc(i.k)+'</span></button>';
  }).join(''):'<div style="padding:26px;text-align:center" class="cap">Nothing matches “'+esc(state.pq)+'”. Try a screen name, a person, or “theme”.</div>';
  state.pItems=items;
}

/* ---------------- EVENT WIRING ---------------- */
function fire(act,arg,el){
  var name=act, a=arg;
  if(act.indexOf('|')>=0){var p=act.split('|');name=p[0];a=p[1]}
  var fn=ACTIONS[name];
  if(!fn){toast('Not wired',"“"+name+"” has no handler. In this build that should be impossible — please report it.",'stop',false);return false}
  fn(a,el); return true;
}
function bind(){
  if(typeof document==='undefined'||!document.addEventListener)return;
  document.addEventListener('click',function(e){
    var t=e.target;
    var el=t&&t.closest?t.closest('[data-act]'):null;
    if(el){
      var act=el.getAttribute('data-act'), arg=el.getAttribute('data-arg')||'';
      if(act!=='roles'&&act!=='bell'&&state.ddOpen){state.ddOpen=null;renderTop()}
      if(act==='nav'||act==='open-thread'||act==='set-role'){var pal=document.getElementById('palette');if(pal)pal.classList.remove('on')}
      e.preventDefault(); e.stopPropagation();
      fire(act,arg,el);
      return;
    }
    /* click-outside closes scrim, palette and dropdowns */
    if(t&&t.id==='scrim')closeModal();
    if(t&&t.id==='palette')t.classList.remove('on');
    if(state.ddOpen){state.ddOpen=null;renderTop()}
  });
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if((e.metaKey||e.ctrlKey)&&(k==='k'||k==='K')){e.preventDefault();ACTIONS['palette']();return}
    var pal=document.getElementById('palette');
    var palOpen=pal&&pal.classList&&pal.classList.contains&&pal.classList.contains('on');
    if(k==='Escape'){
      if(palOpen){pal.classList.remove('on');return}
      var sc=document.getElementById('scrim');
      if(sc&&sc.classList.contains('on')){closeModal();return}
      if(state.ddOpen){state.ddOpen=null;renderTop();return}
      if(state.railOpen){state.railOpen=false;render();return}
      return;
    }
    if(palOpen){
      if(k==='ArrowDown'){e.preventDefault();state.pi++;renderPalette();return}
      if(k==='ArrowUp'){e.preventDefault();state.pi=Math.max(0,state.pi-1);renderPalette();return}
      if(k==='Enter'){
        e.preventDefault();
        var it=(state.pItems||[])[state.pi];
        pal.classList.remove('on');
        if(it)fire(it.act,it.arg);
        return;
      }
      return;
    }
    if(k==='Enter'){
      var ae=document.activeElement;
      if(ae&&ae.id==='composer'){e.preventDefault();ACTIONS['send-msg'](state.thread);return}
      if(ae&&ae.getAttribute&&ae.getAttribute('data-f')){
        var host=document.getElementById('modalhost');
        var btn=host&&host.querySelector?host.querySelector('.mfoot .btn.pri'):null;
        if(btn){e.preventDefault();fire(btn.getAttribute('data-act'),btn.getAttribute('data-arg')||'',btn)}
        return;
      }
    }
  });
  document.addEventListener('input',function(e){
    if(e.target&&e.target.id==='pq'){state.pq=e.target.value;state.pi=0;renderPalette()}
  });
}

/* ---------------- BOOT ---------------- */
function boot(){
  recomputeKPI();
  state.view=roleHome();
  bind();
  render();
}
if(typeof window!=='undefined'){
  window.__APP__={VIEWS:VIEWS,ACTIONS:ACTIONS,ROLES:ROLES,ROLE_ORDER:ROLE_ORDER,state:state,

    recomputeKPI:recomputeKPI,paletteItems:paletteItems,attention:attention,
    DATA:{CANDIDATES:CANDIDATES,FIRMS:FIRMS,CREATORS:CREATORS,CREATIVES:CREATIVES,FINDINGS:FINDINGS,
      PEOPLE:PEOPLE,LEDGER:LEDGER,THREADS:THREADS,DMS:DMS,CHANNELS:CHANNELS,
      PEOPLE_ITEMS:PEOPLE_ITEMS,ACTIVATIONS:ACTIVATIONS,OBLIGATIONS:OBLIGATIONS,ALLOCATIONS:ALLOCATIONS,
      GROUPS:GROUPS,PD_CLAIMS:PD_CLAIMS,AFFILIATES:AFFILIATES,ROUTES:ROUTES,FLEET:FLEET,ASSETS:ASSETS,
      INVENTORY:INVENTORY,CALENDAR:CALENDAR,ACTIVITY:ACTIVITY,SCREENSHOTS:SCREENSHOTS,TIMESHEETS:TIMESHEETS,
      FORMS:FORMS,SUBMISSIONS:SUBMISSIONS,IT_TICKETS:IT_TICKETS,CHANGES:CHANGES,MEDIA_PROJECTS:MEDIA_PROJECTS,
      BODY_SHOPS:BODY_SHOPS,TRACKED:TRACKED,HANDOUTS:HANDOUTS,
      CONTRIBUTIONS:CONTRIBUTIONS,FLIGHTS:FLIGHTS,DISCLOSURES:DISCLOSURES,RULEPACKS:RULEPACKS,
      SOURCES:SOURCES,CAMPAIGNS:CAMPAIGNS,PLACEMENTS:PLACEMENTS,STAFF:STAFF,THEMES:THEMES}};
  if(document&&document.getElementById)boot();
}
