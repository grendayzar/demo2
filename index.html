function renderView(id){
  var v=VIEWS[id];
  if(!v){v=VIEWS.home;logAction('Unknown view "'+id+'" — fell back to Home')}
  return v.render();
}
function renderNav(){
  var h='';
  NAV.forEach(function(g){
    h+='<div class="navgrp">'+esc(g.g)+'</div>';
    g.items.forEach(function(i){
      var n=i.b?i.b():0;
      h+='<button class="navitem'+(state.view===i.v?' on':'')+'" data-act="nav" data-arg="'+i.v+'">'+
        '<span class="ico">'+i.i+'</span><span class="grow trunc">'+esc(i.n)+'</span>'+
        (n>0?'<span class="bdg '+(i.v==='compliance'?'hot':'warn')+'">'+n+'</span>':'')+'</button>';
    });
  });
  var a=me(),tone=a.score>=90?'var(--ok)':a.score>=80?'var(--y)':'var(--warn)';
  h+='<button class="card p" style="margin:14px 8px 0;width:calc(100% - 16px);text-align:left" data-act="nav" data-arg="compliance">'+
    '<div class="rowb"><span class="row"><span class="dot" style="background:'+tone+'"></span>'+
    '<span style="font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tt)">Score</span></span>'+
    '<span class="mono" style="font-size:15px;font-weight:600">'+a.score+'</span></div>'+
    '<div style="margin-top:7px">'+bar(a.score,100,tone)+'</div>'+
    '<div style="font-size:11px;color:var(--tt);margin-top:6px">'+esc(a.tier)+
    (K.nextTier?' · '+(K.nextTier.min-a.score)+' to '+K.nextTier.n:' · top tier')+'</div></button>';
  h+='<div style="padding:14px 12px 0;font-size:10.5px;line-height:1.6;color:var(--tt)">Synthetic data · no backend<br>'+
    '<button class="cite" style="font-family:var(--fm);font-size:10.5px;color:var(--info);border-bottom:1px dotted currentColor" data-act="nav" data-arg="about">What is not real &rarr;</button></div>';
  return h;
}
function renderTop(){
  var lg=document.getElementById('topLogo'); if(lg&&!lg.innerHTML)lg.innerHTML=LOGO_FULL;
  var a=me();
  var b=document.getElementById('mebtn');
  if(b)b.innerHTML='<span class="row">'+av(a.id,'sm')+'<span class="trunc" style="max-width:120px">'+esc(a.name)+'</span> ▾</span>';
  var wm=document.getElementById('whomenu');
  if(wm){
    if(state.ddOpen==='who'){
      wm.innerHTML='<div class="ddm"><div class="ddh">Signed in as</div>'+
        AMBASSADORS.map(function(x){
          return '<button class="'+(x.id===state.amb?'on':'')+'" data-act="set-amb" data-arg="'+x.id+'">'+
            '<span class="row">'+av(x.id,'sm')+'<span class="grow" style="min-width:0">'+
            '<span class="trunc" style="display:block;color:var(--tp);font-weight:'+(x.id===state.amb?'600':'500')+'">'+esc(x.name)+'</span>'+
            '<span class="trunc" style="display:block;font-size:11px;color:var(--tt)">'+esc(x.tier)+' · '+esc(x.geo)+'</span></span>'+
            (x.id===state.amb?pill('p-brand','current'):'')+'</span></button>'}).join('')+
        '<div class="ddh">Program</div>'+
        '<button data-act="nav" data-arg="directory">Company directory</button>'+
        '<button data-act="nav" data-arg="about">What is not real</button></div>';
    } else wm.innerHTML='';
  }
  var items=attention();
  var bc=document.getElementById('bellcount');
  if(bc){bc.textContent=String(items.length);
    bc.className='pill '+(items.length?(items.some(function(i){return i.sev==='bad'})?'p-bad':'p-warn'):'p-neutral')}
  var bm=document.getElementById('bellmenu');
  if(bm){
    if(state.ddOpen==='bell'){
      bm.innerHTML='<div class="ddm" style="min-width:340px"><div class="ddh">Needs '+esc(a.name.split(' ')[0])+'</div>'+
        (items.length?items.slice(0,7).map(function(i){
          return '<button data-act="'+esc(i.act)+'" data-arg="'+esc(i.arg||'')+'">'+
            '<span class="row" style="align-items:flex-start"><span class="dot" style="margin-top:5px;background:var(--'+(i.sev==='bad'?'bad':'warn')+')"></span>'+
            '<span class="grow" style="min-width:0"><span class="trunc" style="display:block;color:var(--tp);font-weight:600">'+esc(i.n)+'</span>'+
            '<span class="trunc" style="display:block;font-size:11px">'+esc(i.why)+'</span></span></span></button>'}).join('')
          :'<div style="padding:20px 12px;text-align:center;font-size:12.5px;color:var(--tt)">Nothing needs you right now.</div>')+
        '<button data-act="nav" data-arg="home" style="border-top:1px solid var(--line);margin-top:6px;padding-top:9px">Open the full queue &rarr;</button></div>';
    } else bm.innerHTML='';
  }
}
function paletteItems(){
  var o=[];
  navViews().forEach(function(i){o.push({t:i.n,s:'Screen',act:'nav',arg:i.v})});
  COMPLIANCE_SECTIONS.forEach(function(s,i){o.push({t:s.t,s:'Compliance manual · section '+(i+1),act:'doc-comp',arg:s.id})});
  CREATIVE_SECTIONS.forEach(function(s,i){o.push({t:s.t,s:'Creative manual · section '+(i+1),act:'doc-cre',arg:s.id})});
  THEMES.forEach(function(t){o.push({t:t.t,s:'Theme '+t.id,act:'open-theme',arg:t.id})});
  CHANNELS.forEach(function(c){o.push({t:'#'+c.n,s:'Channel',act:'open-thread',arg:c.id})});
  AMBASSADORS.forEach(function(x){o.push({t:'Switch to '+x.name,s:x.tier+' ambassador',act:'set-amb',arg:x.id})});
  o.push({t:'Toggle theme',s:'Command',act:'theme',arg:''});
  o.push({t:'Raise a request',s:'Command',act:'pick-form',arg:''});
  return o;
}
function renderPalette(){
  var list=document.getElementById('plist'); if(!list)return;
  var q=(state.pq||'').toLowerCase();
  var items=paletteItems().filter(function(i){return !q||i.t.toLowerCase().indexOf(q)>=0||i.s.toLowerCase().indexOf(q)>=0});
  if(state.pi>=items.length)state.pi=0;
  list.innerHTML=items.length?items.map(function(i,n){
    return '<button class="navitem'+(n===state.pi?' on':'')+'" data-act="'+esc(i.act)+'" data-arg="'+esc(i.arg)+'">'+
      '<span class="grow" style="min-width:0"><span class="trunc" style="display:block">'+esc(i.t)+'</span>'+
      '<span class="trunc" style="display:block;font-size:11px;color:var(--tt)">'+esc(i.s)+'</span></span></button>'}).join('')
    :'<div style="padding:24px;text-align:center;font-size:12.5px;color:var(--tt)">Nothing matches &ldquo;'+esc(state.pq)+'&rdquo;.</div>';
  state.pItems=items;
}
function render(){
  recompute();
  var rail=document.getElementById('rail'),main=document.getElementById('main');
  if(rail){rail.innerHTML=renderNav();rail.className=state.railOpen?'open':''}
  if(main){
    var body;
    try{body=renderView(state.view)}
    catch(e){
      body=phead('Something went wrong on this screen',
        'The portal caught an error rendering "'+state.view+'" and fell back safely rather than blanking.','')+
        empty('◧','Screen unavailable',String(e&&e.message||e),
        '<button class="btn pri" data-act="nav" data-arg="home">Back to home</button>');
      if(typeof console!=='undefined'&&console.error)console.error(e);
    }
    main.innerHTML=body+'<footer class="foot">Ambassador Portal — Accident Professionals. '+
      'Interactive demonstration: all data is synthetic and generated from a fixed seed, there is no backend or authentication, '+
      'and every change clears on reload. '+
      '<button class="cite" style="font-family:var(--fm);color:var(--info);border-bottom:1px dotted currentColor" data-act="nav" data-arg="about">What is not real &rarr;</button></footer>';
    if(main.scrollTop!==undefined)main.scrollTop=0;
  }
  renderTop();
}
function fire(act,arg,el){
  var name=act,a=arg;
  if(act.indexOf('|')>=0){var p=act.split('|');name=p[0];a=p[1]}
  var fn=ACTIONS[name];
  if(!fn){toast('Not wired','"'+name+'" has no handler. In this build that should be impossible.','bad',false);return false}
  fn(a,el); return true;
}
function bind(){
  if(typeof document==='undefined'||!document.addEventListener)return;
  document.addEventListener('click',function(e){
    var t=e.target,el=t&&t.closest?t.closest('[data-act]'):null;
    if(el){
      var act=el.getAttribute('data-act'),arg=el.getAttribute('data-arg')||'';
      if(act!=='who'&&act!=='bell'&&state.ddOpen){state.ddOpen=null;renderTop()}
      if(act==='nav'||act==='set-amb'||act==='open-thread'||act==='doc-comp'||act==='doc-cre'||act==='open-theme'){
        var pal=document.getElementById('palette'); if(pal)pal.style.display='none';
      }
      e.preventDefault(); e.stopPropagation();
      fire(act,arg,el);
      return;
    }
    if(t&&t.id==='scrim')closeModal();
    if(t&&t.id==='palette')t.style.display='none';
    if(state.ddOpen){state.ddOpen=null;renderTop()}
  });
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if((e.metaKey||e.ctrlKey)&&(k==='k'||k==='K')){e.preventDefault();ACTIONS['palette']();return}
    var pal=document.getElementById('palette');
    var open=pal&&pal.style&&pal.style.display==='block';
    if(k==='Escape'){
      if(open){pal.style.display='none';return}
      var sc=document.getElementById('scrim');
      if(sc&&sc.classList.contains('on')){closeModal();return}
      if(state.ddOpen){state.ddOpen=null;renderTop();return}
      if(state.railOpen){state.railOpen=false;render();return}
      return;
    }
    if(open){
      if(k==='ArrowDown'){e.preventDefault();state.pi++;renderPalette();return}
      if(k==='ArrowUp'){e.preventDefault();state.pi=Math.max(0,state.pi-1);renderPalette();return}
      if(k==='Enter'){e.preventDefault();var it=(state.pItems||[])[state.pi];pal.style.display='none';if(it)fire(it.act,it.arg);return}
      return;
    }
    if(k==='Enter'){
      var ae=document.activeElement;
      if(ae&&ae.id==='composer'){e.preventDefault();ACTIONS['send-msg'](state.thread);return}
      if(ae&&ae.getAttribute&&ae.getAttribute('data-f')){
        var host=document.getElementById('modalhost');
        var btn=host&&host.querySelector?host.querySelector('.mfoot .btn.pri'):null;
        if(btn){e.preventDefault();fire(btn.getAttribute('data-act'),btn.getAttribute('data-arg')||'',btn)}
        return;
      }
    }
  });
  document.addEventListener('input',function(e){
    if(e.target&&e.target.id==='pq'){state.pq=e.target.value;state.pi=0;renderPalette()}
  });
}
function boot(){recompute();bind();render()}
if(typeof window!=='undefined'){
  window.__APP__={VIEWS:VIEWS,ACTIONS:ACTIONS,NAV:NAV,state:state,renderView:renderView,render:render,
    fire:fire,boot:boot,K:function(){return K},recompute:recompute,paletteItems:paletteItems,attention:attention,
    DATA:{AMBASSADORS:AMBASSADORS,STAFF:STAFF,PEOPLE:PEOPLE,THEMES:THEMES,SUBMISSIONS:SUBMISSIONS,
      TASKS:TASKS,CALLBACKS:CALLBACKS,EVENTS:EVENTS,EARNINGS:EARNINGS,TICKETS:TICKETS,FORM_DEFS:FORM_DEFS,
      NEWS:NEWS,CHANNELS:CHANNELS,DMS:DMS,THREADS:THREADS,FINDINGS:FINDINGS,SOCIALS:SOCIALS,
      SCORE_MATRIX:SCORE_MATRIX,TIER_RULES:TIER_RULES,STAGES:STAGES,
      COMPLIANCE_SECTIONS:COMPLIANCE_SECTIONS,CREATIVE_SECTIONS:CREATIVE_SECTIONS}};
  if(document&&document.getElementById)boot();
}
