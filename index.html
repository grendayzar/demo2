    (K.nextTier?'You are '+(K.nextTier.min-a.score)+' points from <b>'+K.nextTier.n+'</b>. The fastest route is clean submissions — it carries thirty of the hundred points and it is the one component entirely within your control.'
      :'You are at the top tier. It is held by staying here, not by reaching it once.')+'</div>'+
    '<div style="margin-top:12px">'+bar(a.score,100,tone)+'</div>'+
    '<div class="row" style="gap:16px;margin-top:12px;font-size:11.5px;color:var(--tt)">'+
    '<span>Certified until <b class="mono">'+fdate(a.certExpires)+'</b></span>'+
    '<span>FTC acknowledgement <b class="mono">'+fdate(a.ftcAck)+'</b></span></div>'+
    '</div></div></div>';
  h+='<div class="card">'+cardHead('Tier ladder')+'<div class="cbody n">'+
    TIER_RULES.slice().reverse().map(function(r){
      var on=r.tier===a.tier;
      return '<div class="lrow" style="cursor:default'+(on?';background:var(--ysoft)':'')+'">'+
        '<span class="mono" style="width:34px;flex:none;font-weight:600">'+r.min+'+</span>'+
        '<span class="grow"><span class="t">'+esc(r.n)+(on?' — you are here':'')+'</span>'+
        '<span class="s" style="white-space:normal">'+esc(r.d)+'</span></span></div>'}).join('')+'</div></div>';
  h+='</div>';

  h+=seclabel('Scoring matrix');
  h+='<div class="card"><div class="tw"><table><thead><tr>'+
    '<th>Component</th><th>What it measures</th><th class="num">Weight</th><th style="width:180px">Your score</th><th class="num">Points</th></tr></thead><tbody>'+
    SCORE_MATRIX.map(function(c){
      var v=a.components[c.k],pts=(v*c.w/100);
      var col=v>=90?'var(--ok)':v>=75?'var(--y)':'var(--bad)';
      return '<tr><td><b>'+esc(c.n)+'</b></td>'+
        '<td class="muted" style="max-width:400px">'+esc(c.d)+'</td>'+
        '<td class="num">'+c.w+'</td>'+
        '<td>'+bar(v,100,col)+'<span class="mono" style="font-size:11px;color:var(--tt)">'+v+'/100</span></td>'+
        '<td class="num">'+pts.toFixed(1)+'</td></tr>'}).join('')+
    '<tr><td colspan="4" style="text-align:right;font-weight:700">Total</td><td class="num" style="font-weight:700">'+a.score+'.0</td></tr>'+
    '</tbody></table></div></div>';
  h+='<div class="card p" style="margin-top:12px"><b style="font-size:13px">How the number actually moves</b>'+
    '<p style="font-size:12.5px;color:var(--ts);line-height:1.7;margin-top:6px">A change request is not a penalty and does not reduce your score on its own — it reduces your clean rate only if you had to be asked. A substantiated finding does reduce it, and how much depends on severity and on how quickly you fixed it. Nothing about follower count, view count or how many callbacks you generate is in this table, and nothing ever will be. Reach is not conduct.</p></div>';

  h+=seclabel('Review pipeline');
  var counts={};STAGES.forEach(function(s){counts[s.k]=subs.filter(function(x){return x.stage===s.k}).length});
  h+='<div class="grid g4" style="margin-bottom:12px">'+STAGES.filter(function(s){return counts[s.k]}).map(function(s){
    return '<button class="card stat" style="text-align:left;width:100%" data-act="filter-sub" data-arg="'+s.k+'">'+
      '<div class="k">'+esc(s.n)+'</div><div class="v">'+counts[s.k]+'</div>'+
      '<div class="d">'+(s.k==='CHANGES'?'waiting on you':s.k==='HUMAN'?'waiting on us':'')+'</div></button>'}).join('')+'</div>';
  var f=state.sub||'ALL';
  var pool=f==='ALL'?subs:subs.filter(function(s){return s.stage===f});
  h+=table([{h:'Submission'},{h:'Theme'},{h:'Platform'},{h:'Submitted'},{h:'Verdict in'},{h:'Revisions',num:true},{h:'Stage'}],
    pool.sort(function(x,y){return y.submitted-x.submitted}).map(function(s){
      return {act:'open-sub',arg:s.id,cells:[
        '<b>'+esc(s.title)+'</b><div class="mono dim" style="font-size:11px">'+s.id+'</div>',
        '<span class="chip">'+esc(s.theme)+'</span>',esc(s.plat),
        s.stage==='DRAFT'?'<span class="dim">not submitted</span>':frel(s.submitted),
        s.verdictMins?'<span class="mono">'+s.verdictMins+'m</span>':'<span class="dim">—</span>',
        String(s.revisions),pill(stageOf(s.stage).tone,stageOf(s.stage).n)]}}),
    {icon:'◈',t:'Nothing in this stage',b:'Change the filter above.',
     btn:'<button class="btn" data-act="filter-sub" data-arg="ALL">Show everything</button>'});

  h+=seclabel('Your findings record');
  h+=table([{h:'Reference'},{h:'Severity'},{h:'Category'},{h:'What happened'},{h:'Outcome'},{h:'Status'}],
    fs.map(function(x){return {act:'open-finding',arg:x.id,cells:[
      '<span class="mono dim">'+x.id+'</span>',
      pill(x.sev==='SEV1'?'p-bad':x.sev==='SEV2'?'p-warn':'p-info',x.sev),
      esc(x.cat),'<span class="muted trunc" style="display:block;max-width:320px">'+esc(x.detail)+'</span>',
      '<span class="muted trunc" style="display:block;max-width:260px">'+esc(x.remedy)+'</span>',
      pill(x.status==='SUBSTANTIATED'?'p-bad':x.status==='DISMISSED'?'p-neutral':'p-ok',x.status)]}}),
    {icon:'✓',t:'No findings on your record',b:'That is the outcome everybody is working toward. It is also the single biggest driver of your score.'});
  return h;
}};

/* ==========================================================================
   KNOWLEDGE CENTER — MANUALS
   ========================================================================== */
function manualView(key,title,lead,sections,homeAct){
  return {title:title,render:function(){
    var cur=state.doc&&sections.some(function(s){return s.id===state.doc})?state.doc:sections[0].id;
    var idx=0;sections.forEach(function(s,i){if(s.id===cur)idx=i});
    var sec=sections[idx];
    var h=phead(title,lead,
      '<button class="btn sm" data-act="export" data-arg="'+title+'">Download PDF</button>'+
      '<button class="btn sm" data-act="open-form" data-arg="FRM-06">Ask a question</button>');
    h+='<div class="manual">';
    h+='<div class="card toc" style="padding:8px">'+
      '<div class="navgrp">Contents</div>'+
      sections.map(function(s,i){
        return '<button class="'+(s.id===cur?'on':'')+'" data-act="'+homeAct+'" data-arg="'+s.id+'">'+
          '<span class="mono" style="font-size:10.5px;color:var(--tt);margin-right:6px">'+String(i+1).padStart(2,'0')+'</span>'+esc(s.t)+'</button>'}).join('')+
      '</div>';
    h+='<div class="card p"><div class="doc">'+
      '<div class="mono" style="font-size:11px;color:var(--tt);letter-spacing:.06em;margin-bottom:6px">SECTION '+String(idx+1).padStart(2,'0')+' OF '+String(sections.length).padStart(2,'0')+'</div>'+
      '<h2>'+esc(sec.t)+'</h2>'+sec.body+
      '<div class="pnav">'+
      (idx>0?'<button class="btn sm" data-act="'+homeAct+'" data-arg="'+sections[idx-1].id+'">&larr; '+esc(sections[idx-1].t)+'</button>':'<span></span>')+
      (idx<sections.length-1?'<button class="btn sm" data-act="'+homeAct+'" data-arg="'+sections[idx+1].id+'">'+esc(sections[idx+1].t)+' &rarr;</button>':'<span></span>')+
      '</div></div></div>';
    h+='</div>';
    return h;
  }};
}

var COMPLIANCE_SECTIONS=[
{id:'c1',t:'What you are, and what you are not',body:
'<p class="lead">Read this section twice. Almost every problem in this programme comes from somebody forgetting one of the four sentences below.</p>'+
'<p>You are a <b>paid publisher of attorney advertising</b>. That is the whole of your legal role, and it is a real one. When you post about what to do after a crash, you are not sharing a personal opinion — you are running an advertisement, and it is governed by the rules that govern lawyer advertising in the state where it is seen.</p>'+
'<div class="rule"><b>The four sentences</b><p>You are not a lawyer. You are not an employee of a law firm. You do not give legal advice. You never promise an outcome.</p></div>'+
'<h3>Why this is stricter than ordinary influencer work</h3>'+
'<p>A creator promoting a protein powder answers to the Federal Trade Commission. You answer to the FTC <i>and</i> to the rules of professional conduct in every state where your content is seen — because advertising for lawyers is regulated far more tightly than advertising for almost anything else. A post that would be unremarkable for a fitness brand can create a genuine problem for the attorneys we work with.</p>'+
'<p>That is not a reason to be timid. It is a reason to work inside the themes and the claim sets, which exist precisely so you can move quickly without having to make these judgements yourself.</p>'+
'<h3>Who carries the consequence</h3>'+
'<p>Three parties carry it. The attorney can face discipline from their state bar. The company can lose the network. And you personally can be exposed under state statutes that treat certain conduct — soliciting accident victims, being paid per case — as a crime rather than a policy problem. Sections 7 and 10 cover those two directly.</p>'+
'<p>Nobody is trying to frighten you. The rules are learnable, there are not many of them, and once you have them the work is straightforward.</p>'},

{id:'c2',t:'The rules that govern your work',body:
'<p class="lead">Five bodies of rule apply to what you publish. You do not need to be able to cite them. You do need to recognise the situations where they bite.</p>'+
'<h3>1. Rules of professional conduct — lawyer advertising</h3>'+
'<p>Every state has adopted a version of the American Bar Association Model Rules. The three that matter to you:</p>'+
'<table><thead><tr><th>Rule</th><th>What it says</th><th>What it means for you</th></tr></thead><tbody>'+
'<tr><td class="mono">7.1</td><td>No false or misleading communication about a lawyer or their services, including anything that creates an unjustified expectation of results.</td><td>No guarantees, no promises of money, no unverifiable comparisons.</td></tr>'+
'<tr><td class="mono">7.2</td><td>Rules on advertising, including who may be paid and for what.</td><td>You are paid a flat fee for making advertising. Never per case.</td></tr>'+
'<tr><td class="mono">7.3</td><td>Restricts live, in-person and real-time solicitation of people who did not ask for contact.</td><td>You never approach somebody you know has been in an accident. Ever.</td></tr>'+
'</tbody></table>'+
'<p>The exact numbering varies by state — a handful use different rule numbers for the same substance — but the substance is consistent enough that if you follow this manual you are compliant in every state we operate in. Where a state is materially stricter, you will see a notice on the theme brief.</p>'+
'<h3>2. Federal Trade Commission — endorsements</h3>'+
'<p>The FTC Endorsement Guides require that a <b>material connection</b> between you and the brand be disclosed clearly and conspicuously. You are paid. That is a material connection. It must be disclosed on every single piece, with no exceptions for organic posts, stories, or comments.</p>'+
'<h3>3. Telephone Consumer Protection Act</h3>'+
'<p>Nobody may be called or texted without prior express written consent. This is why your call-back page has a fixed form you cannot edit, and why you must never collect somebody\u2019s number in your direct messages and pass it along. The consent has to be captured in the form, in writing, with the disclosure visible.</p>'+
'<h3>4. State criminal statutes</h3>'+
'<p>Several states — Georgia among them — make it a crime to solicit accident victims for money, or to act as a paid intermediary who steers cases to lawyers. These statutes use words like <b>capper</b>, <b>runner</b> and <b>steerer</b>. Penalties escalate to felony. This is the single most serious body of law you work under and it is the reason for two of our hardest rules: inbound contact only, and flat pay only.</p>'+
'<h3>5. Platform terms</h3>'+
'<p>Every platform has its own rules on legal-services advertising and on disclosure formatting. Where a platform rule is stricter than ours, follow the platform. Where ours is stricter, follow ours. They are never in genuine conflict.</p>'+
'<p class="muted" style="font-size:12.5px">Citations in this manual point at the ABA model rule. Your state has adopted its own version. If you ever need the exact citation for a specific state, raise a compliance question and you will have it the same day.</p>'},

{id:'c3',t:'What you may say',body:
'<p class="lead">Everything you say must be traceable to a claim on the approved list for the theme you are working in. If it is not on the list, it is not approved — even if it is true.</p>'+
'<h3>The standing claim set</h3>'+
'<p>These four are approved on every theme, in every state, with no further review:</p>'+
'<div class="rule yes"><b>Always available to you</b><p>&ldquo;We connect you with an attorney at no cost to you.&rdquo;<br>&ldquo;The consultation is free.&rdquo;<br>&ldquo;We speak Spanish.&rdquo;<br>&ldquo;We are available 24 hours a day.&rdquo;</p></div>'+
'<h3>Theme-specific claims</h3>'+
'<p>Each theme carries additional approved claims, listed on the theme brief and repeated in the script builder. For example, the insurer-call theme allows you to say that a person is not required to give a recorded statement — a claim that would need review on any other theme.</p>'+
'<h3>The test to apply before you say anything</h3>'+
'<ol>'+
'<li><b>Is it on the list?</b> If yes, say it. If no, go to 2.</li>'+
'<li><b>Is it a fact about what we do?</b> Describing our own service is generally safe. &ldquo;We answer the phone at night&rdquo; is a fact about us.</li>'+
'<li><b>Is it a fact about what will happen to them?</b> Stop. That is an outcome, and outcomes are never yours to describe.</li>'+
'<li><b>Are you unsure?</b> Ask in the compliance channel before you record. A question costs four minutes. A finding costs a tier.</li>'+
'</ol>'+
'<h3>Describing a process is not advising</h3>'+
'<p>There is a line here worth understanding properly, because it is where most good ambassadors get nervous unnecessarily.</p>'+
'<p><b>Describing a process is allowed.</b> &ldquo;After a workplace injury, most people report it to their employer in writing&rdquo; is a description of how a process generally works. It is public information and it is genuinely useful.</p>'+
'<p><b>Advising a person is not.</b> &ldquo;You should report yours in writing tomorrow&rdquo; is advice directed at an individual about their own situation. That is practising law without a licence, and it is the thing our disclosure says we do not do.</p>'+
'<p>The difference is the word &ldquo;you&rdquo; pointed at one identifiable person with a real problem. Speak to an audience about how things generally work. Never speak to an individual about what they should do.</p>'},

{id:'c4',t:'What you may never say',body:
'<p class="lead">This list is short and it is absolute. There is no theme, no state and no context in which any of these becomes acceptable.</p>'+
'<div class="rule never"><b>Never, under any circumstances</b><p>Any guarantee, prediction or suggestion of an outcome.<br>Any figure, range or hint about how much money somebody might receive.<br>Any comparison you cannot prove — &ldquo;the best&rdquo;, &ldquo;number one&rdquo;, &ldquo;the top firm&rdquo;.<br>Any statement that you or the company are lawyers, or that we represent anybody.<br>Any advice to a specific person about their specific situation.<br>Any claim to be a specialist, an expert or certified in a field, unless you actually hold that certification and can name the certifying body.</p></div>'+
'<h3>The phrases that get caught most often</h3>'+
'<table><thead><tr><th>Do not say</th><th>Why</th><th>Say instead</th></tr></thead><tbody>'+
'<tr><td>&ldquo;Te conseguimos tu dinero&rdquo;</td><td>Promises an outcome and an amount</td><td>&ldquo;Te conectamos con un abogado&rdquo;</td></tr>'+
'<tr><td>&ldquo;You will get a settlement&rdquo;</td><td>Predicts a result</td><td>&ldquo;A lawyer can tell you what your options are&rdquo;</td></tr>'+
'<tr><td>&ldquo;We are the best in Georgia&rdquo;</td><td>Unverifiable comparison</td><td>&ldquo;We work with attorneys across the state&rdquo;</td></tr>'+
'<tr><td>&ldquo;Do not talk to the adjuster&rdquo;</td><td>Legal advice</td><td>&ldquo;You are not required to give a recorded statement&rdquo;</td></tr>'+
'<tr><td>&ldquo;My lawyer got me $40,000&rdquo;</td><td>Outcome, amount, and a personal endorsement of a specific result</td><td>Nothing. There is no compliant version of this.</td></tr>'+
'<tr><td>&ldquo;Free money&rdquo; / &ldquo;easy money&rdquo;</td><td>Misleading about the nature of a legal claim</td><td>Nothing. Do not go near this framing.</td></tr>'+
'</tbody></table>'+
'<h3>Two special cases</h3>'+
'<h4>Your own accident</h4>'+
'<p>If you have personally been in an accident and want to talk about it, that is allowed and it is often powerful. But you may not describe what you received, what your case was worth, or how it resolved. Describe the experience, not the outcome. If you are unsure whether your story stays on the right side of this, send it to compliance before you shoot it.</p>'+
'<h4>Comments and duets</h4>'+
'<p>Everything in this section applies to comments and replies exactly as it applies to a posted video. A promise made in a comment is a promise. Additionally: <b>never duet, stitch or repost footage of a real person\u2019s accident.</b> That places our advertising next to an identifiable individual who never agreed to appear in it, and if they are a potential claimant it starts to look like we approached them.</p>'},

{id:'c5',t:'Required disclosures',body:
'<p class="lead">Three disclosures. Two of them go on everything. The portal adds them automatically, but you are still responsible for confirming they are visible and legible.</p>'+
'<h3>1. Material connection — on every piece, no exceptions</h3>'+
'<div class="rule"><b>Approved wording</b><p>English: <b>#ad — Paid partnership with Accident Professionals. I am not an attorney and this is not legal advice.</b><br>Spanish: <b>#publicidad — Colaboracion pagada con Accident Professionals. No soy abogado y esto no es asesoria legal.</b></p></div>'+
'<p><b>Where it goes:</b> in the caption, in the first two lines, before any &ldquo;more&rdquo; truncation — and burned into the video for its full duration. Not one or the other. Both.</p>'+
'<p>The most common finding in this programme is a disclosure that was in the video but not in the caption. The caption preview in the submit step highlights it for you. If it is not highlighted, it is not there.</p>'+
'<h3>2. Not a law firm — on every piece</h3>'+
'<p><b>Accident Professionals is not a law firm and does not provide legal advice.</b> This appears in the burned-in end card and is added automatically at export.</p>'+
'<h3>3. Contingent fee — only if fees come up</h3>'+
'<p>If you mention fees, costs, or say anything resembling &ldquo;no fee unless you win&rdquo;, a further disclosure is required, and its wording varies by state. Do not improvise it. The script builder will insert the correct version, or compliance will supply it.</p>'+
'<p class="muted">Honestly, the simplest approach is not to discuss fees at all. &ldquo;The consultation is free&rdquo; is on the standing claim set and covers what most people are actually asking.</p>'+
'<h3>Legibility standards</h3>'+
'<ul>'+
'<li>On screen for a minimum of four seconds, or the full duration for anything under fifteen seconds.</li>'+
'<li>Inside the safe area, so no platform crop can remove it. A disclosure that gets cropped is legally absent.</li>'+
'<li>Contrast high enough to read on a phone in daylight. Grey on grey does not count as disclosed.</li>'+
'<li>In the same language as the content. An English disclosure on Spanish content discloses nothing to the person watching.</li>'+
'</ul>'+
'<div class="rule never"><b>Never do this</b><p>Do not put the disclosure only in your bio. Do not put it after a &ldquo;more&rdquo; cut. Do not shrink it to fit a design. Do not use only a hashtag with no words. Do not remove it from a repost.</p></div>'},

{id:'c6',t:'How people may reach you',body:
'<p class="lead">The direction of first contact is the most important fact about every interaction you have. Get this wrong and it is not a policy problem.</p>'+
'<h3>The rule</h3>'+
'<div class="rule never"><b>They come to you. You never go to them.</b><p>You may never initiate contact with a person you know, believe or suspect has been in an accident. Not in person, not by phone, not by direct message, not through a friend, not by leaving a card.</p></div>'+
'<h3>What you may do</h3>'+
'<ul>'+
'<li>Publish advertising to a general audience. That is the entire job.</li>'+
'<li>Answer somebody who contacts you first.</li>'+
'<li>Hand somebody a card or a link when <b>they</b> ask you what you do.</li>'+
'<li>Be visible at an event, at a table, in a store, with materials available for anyone who approaches.</li>'+
'</ul>'+
'<h3>What you may never do</h3>'+
'<ul>'+
'<li>Approach somebody at a crash scene, a hospital, a body shop, a tow yard or an impound lot.</li>'+
'<li>Message somebody because you saw they were in an accident.</li>'+
'<li>Ask a friend or family member to pass a name and number to you.</li>'+
'<li>Take a person\u2019s details on their behalf and enter them into a form yourself.</li>'+
'<li>Accept a list of accident victims from anybody, for any reason, at any price.</li>'+
'</ul>'+
'<h3>When somebody tells you they have been in an accident</h3>'+
'<p>This will happen, often. Somebody comments on a video, or stops you at an event, and tells you what happened to them. Here is exactly what to do.</p>'+
'<ol>'+
'<li><b>Be a person first.</b> Ask if they are alright. This is not a script instruction; it is the correct human response and it is also, as it happens, the correct professional one.</li>'+
'<li><b>Do not ask for details of the accident.</b> You do not need them and you should not have them.</li>'+
'<li><b>Give them the link.</b> &ldquo;If you want somebody to call you, put your number in here and they will.&rdquo;</li>'+
'<li><b>Let them fill it in, on their own device.</b> Never type it for them. Never hold their phone.</li>'+
'<li><b>Stop there.</b> Do not follow up. Do not check whether they submitted. Do not mention it again.</li>'+
'</ol>'+
'<p>If they ask a legal question, the answer is always the same: <i>&ldquo;I am not a lawyer, so I genuinely cannot answer that — but the attorney can, and the call is free.&rdquo;</i></p>'+
'<h3>At events</h3>'+
'<p>The device goes into their hand. They type their own details and they sign for themselves. There is no screen anywhere in our system that can record a capture entered by staff on somebody else\u2019s behalf, and that absence is deliberate.</p>'},

{id:'c7',t:'Recording, privacy and other people',body:
'<p class="lead">Other people appear in your content. Some of them have rights about that, and a few of those rights are criminal in nature.</p>'+
'<h3>Filming other people</h3>'+
'<ul>'+
'<li><b>Anyone recognisable in your content must have agreed to be there.</b> A release is required for anybody featured. The portal has one under Forms.</li>'+
'<li><b>Incidental background people</b> in a public place are generally acceptable. A crowd at a festival is fine. A close-up of one stranger is not.</li>'+
'<li><b>Never film anybody who is injured, distressed, or receiving medical attention.</b> There is no consent that makes this acceptable for our purposes.</li>'+
'<li><b>Children</b> require a parent or guardian present and consenting, in writing, on camera-day. No exceptions and no verbal agreements.</li>'+
'</ul>'+
'<h3>Recording conversations</h3>'+
'<p>States differ on whether one party or all parties must consent to a recording. Because you may be speaking with somebody in another state, the safe rule is the strict one: <b>tell people they are being recorded and get an audible yes.</b> If they say no, stop recording. That is the end of it.</p>'+
'<h3>Information that is not yours to hold</h3>'+
'<div class="rule never"><b>Do not collect, keep or pass on</b><p>Phone numbers or addresses of people who told you about an accident.<br>Photographs of accident scenes, police reports, or medical documents.<br>Screenshots of direct messages describing somebody\u2019s injury.<br>Any list of accident victims from any source, paid or free.</p></div>'+
'<p>If somebody sends you any of the above unsolicited, do not forward it, do not save it, and raise a compliance question so it is recorded that you received it and did not act on it.</p>'+
'<h3>Your own data</h3>'+
'<p>Your submissions, your compliance record and your earnings history are retained for as long as the law requires and are available to you at any time. Your social account credentials are not stored by us — the connection in the socials module is a token you can revoke from your own account settings, and revoking it does not affect your standing here.</p>'},

{id:'c8',t:'Working with minors and vulnerable people',body:
'<p class="lead">A separate section because the ordinary rules are not sufficient here, and because getting this wrong is unrecoverable.</p>'+
'<h3>Minors</h3>'+
'<ul>'+
'<li>Never take a call-back request from somebody you know or believe to be under eighteen. Direct them to a parent or guardian.</li>'+
'<li>Never feature a minor in content without a guardian present and a signed release from that guardian.</li>'+
'<li>Never discuss a minor\u2019s accident, injury or claim, even without naming them.</li>'+
'<li>If a minor contacts you about an accident, respond kindly, tell them to ask a parent or guardian to make the request, and raise a compliance question so we know it happened.</li>'+
'</ul>'+
'<h3>People who are not in a position to decide</h3>'+
'<p>Somebody who is in pain, medicated, newly bereaved, or in acute distress is not in a position to make a considered decision about legal representation, and approaching them in that state is exactly what the solicitation rules exist to prevent.</p>'+
'<div class="rule"><b>If somebody seems to be in crisis</b><p>Do not talk about the company, the link, or the attorney. Ask whether they have somebody with them. If there is any suggestion of harm to themselves, give them emergency services or a crisis line, and tell your manager afterwards. There is no version of this situation where making a referral is the right instinct.</p></div>'+
'<h3>Language and comprehension</h3>'+
'<p>Speak with people in the language they choose. If somebody is clearly not following what you are saying, slow down rather than simplifying the disclosure — the disclosure is the part that must not be simplified. If you cannot make yourself understood, that is a reason to hand off, not to push on.</p>'},

{id:'c9',t:'The review process',body:
'<p class="lead">Nothing publishes without review. Not for anybody, not at any tier, not ever. Here is exactly how it works and how long each part takes.</p>'+
'<h3>The stages</h3>'+
'<table><thead><tr><th>Stage</th><th>Who</th><th>Typical time</th><th>What happens</th></tr></thead><tbody>'+
'<tr><td>Draft</td><td>You</td><td>—</td><td>Yours alone. Nobody sees it.</td></tr>'+
'<tr><td>Submitted</td><td>System</td><td>Seconds</td><td>Format, safe area and disclosure placement checked mechanically.</td></tr>'+
'<tr><td>AI review</td><td>System</td><td>Under 2 minutes</td><td>Every spoken and written line checked against the approved claim set, in your language.</td></tr>'+
'<tr><td>Human review</td><td>Compliance</td><td>Median 8 minutes</td><td>Judgement calls the machine flagged, plus a read of tone and context.</td></tr>'+
'<tr><td>Changes asked</td><td>You</td><td>Your call</td><td>A specific, named fix. Usually one line.</td></tr>'+
'<tr><td>Approved</td><td>Compliance</td><td>—</td><td>Cleared to publish. A responsible attorney is attached at this point.</td></tr>'+
'</tbody></table>'+
'<h3>How to read a change request</h3>'+
'<p>A change request tells you three things: the timecode, the problem, and a suggested replacement. It is not a judgement about your work and it does not reduce your score by itself. The system is designed on the assumption that change requests will happen — that is what a review step is for.</p>'+
'<div class="rule yes"><b>The right instinct</b><p>Fix it and resubmit. The fastest remediation on record in this programme is four minutes. Arguing with a change request is almost never worth the time; if you genuinely disagree, resubmit the fix and then raise a compliance question separately.</p></div>'+
'<h3>What gets rejected rather than changed</h3>'+
'<p>Rejection is reserved for content that cannot be fixed by editing: an outcome guarantee that runs through the whole piece, footage of a real accident, an identifiable person who has not consented, or a claim that is simply outside anything we can approve. You will always be told which of these it was.</p>'+
'<h3>After you publish</h3>'+
'<p>Approved content is monitored after publication too. If something is flagged post-publication — usually a comment you made, or an edit you applied after approval — you will hear about it the same day. Do not edit an approved piece after it clears review. Republish through the portal instead.</p>'},

{id:'c10',t:'How you are paid, and why',body:
'<p class="lead">You are paid flat fees for work delivered. Never a share, never a bonus tied to results, never anything per case. This section explains why, because understanding it protects you.</p>'+
'<h3>What you are paid for</h3>'+
'<table><thead><tr><th>Payment</th><th>Triggered by</th><th>Varies with</th></tr></thead><tbody>'+
'<tr><td>Production fee</td><td>A piece clearing review</td><td>Your tier. Nothing else.</td></tr>'+
'<tr><td>Flight fee</td><td>Completing an agreed set of deliverables</td><td>Your tier. Nothing else.</td></tr>'+
'<tr><td>Event stipend</td><td>Attending a booked event</td><td>Hours and role, posted in advance.</td></tr>'+
'<tr><td>Expenses</td><td>Approved receipts</td><td>What you actually spent.</td></tr>'+
'</tbody></table>'+
'<h3>What you are never paid for</h3>'+
'<div class="rule never"><b>Structurally impossible</b><p>Per callback request. Per person who signs with an attorney. Per case that resolves. Any percentage of anything. Any bonus that moves with case outcomes.</p></div>'+
'<p>There is no field in this system that could hold such a payment. That is not a setting somebody could switch on — it does not exist in the data model, and a monthly audit checks that payout amounts show no statistical correlation with case outcomes.</p>'+
'<h3>Why it matters to you personally</h3>'+
'<p>Several states make it a crime to be paid for steering legal business — the statutes use the words capper, runner and steerer. Penalties escalate to felony territory with substantial fines per violation. Critically, <b>those statutes reach the intermediary, not only the lawyer.</b> That is you.</p>'+
'<p>A flat fee for making an advertisement is payment for advertising, which is expressly permitted. A payment that moves with case outcomes is payment for steering, which is not. The difference is the entire legal foundation of this programme and it is why we will never negotiate on it, however reasonable the request sounds.</p>'+
'<div class="rule"><b>If somebody offers you money for a referral</b><p>It happens. A shop owner, a tow driver, occasionally an attorney outside the network. The answer is no, and then you tell your manager the same day so it goes on the record that you were asked and declined. That record protects you.</p></div>'},

{id:'c11',t:'Findings, severity and consequences',body:
'<p class="lead">A finding is a recorded observation that something went wrong. Most are minor, most are fixed the same day, and most people in this programme collect a few.</p>'+
'<h3>Severity</h3>'+
'<table><thead><tr><th>Level</th><th>Examples</th><th>Response time</th><th>Effect</th></tr></thead><tbody>'+
'<tr><td><b>Sev-1</b></td><td>Outcome guarantee published. Payment taken for a referral. Approaching an accident victim.</td><td>Immediate</td><td>Content pulled, account paused pending review, tier reset.</td></tr>'+
'<tr><td><b>Sev-2</b></td><td>Missing disclosure. Legal advice in a comment. Filming somebody without a release.</td><td>4 business hours</td><td>Content pulled or corrected. Score impact. Remedial module.</td></tr>'+
'<tr><td><b>Sev-3</b></td><td>Claim outside the approved set. Disclosure present but hard to read.</td><td>48 hours</td><td>Correction requested. Minor score impact.</td></tr>'+
'<tr><td><b>Sev-4</b></td><td>Brand conformance. Wrong logo file. Aspect ratio.</td><td>1 week</td><td>Correction requested. No score impact.</td></tr>'+
'</tbody></table>'+
'<h3>Statuses</h3>'+
'<ul>'+
'<li><b>Open</b> — raised, not yet adjudicated. It is not held against you at this stage.</li>'+
'<li><b>Dismissed</b> — reviewed and found not to be a violation. Detectors produce false positives and dismissals are common and unremarkable.</li>'+
'<li><b>Substantiated</b> — it was a violation. Recorded with the remedy applied.</li>'+
'<li><b>Remediated</b> — substantiated, then fixed. Stays visible on your record but stops affecting your score.</li>'+
'</ul>'+
'<h3>Consequences, in order</h3>'+
'<ol>'+
'<li><b>Correction.</b> Fix it and move on. The overwhelming majority end here.</li>'+
'<li><b>Remedial training.</b> A short module on the specific issue.</li>'+
'<li><b>Tier reset to Probationary.</b> Lower rates, no flights, until you rebuild the record.</li>'+
'<li><b>Quarantine.</b> Payouts held, links disabled, publication stopped while a matter is investigated.</li>'+
'<li><b>Removal from the programme.</b> Reserved for Sev-1 conduct, dishonesty during an investigation, or a pattern that does not improve.</li>'+
'</ol>'+
'<div class="rule"><b>The one thing that escalates fastest</b><p>Concealment. A missed disclosure is a Sev-2 and a bad afternoon. A missed disclosure you tried to hide, or were not straight about when asked, is a different conversation entirely. Nobody has ever been removed from this programme for making a mistake and saying so immediately.</p></div>'},

{id:'c12',t:'When something goes wrong',body:
'<p class="lead">You have a duty to report, and reporting is always the right move. This page tells you where each thing goes and how fast.</p>'+
'<h3>Report immediately — same hour</h3>'+
'<ul>'+
'<li>Anybody offering you money for a referral, a name, or a phone number.</li>'+
'<li>Anybody asking you to approach an accident victim.</li>'+
'<li>Being sent a list of accident victims or crash data by anyone.</li>'+
'<li>An injury or a safety problem at an event.</li>'+
'<li>Somebody in crisis who you believe may be at risk.</li>'+
'</ul>'+
'<p>Use the event-problem form, or message your manager directly if it is faster. Do not wait to be certain — reporting something that turns out to be nothing costs nobody anything.</p>'+
'<h3>Report the same day</h3>'+
'<ul>'+
'<li>You realise a published piece has a problem.</li>'+
'<li>You said something in a comment you should not have.</li>'+
'<li>Somebody has copied our content and is running it without disclosures.</li>'+
'<li>An attorney or firm contacts you directly about a case.</li>'+
'</ul>'+
'<h3>Raise a compliance question</h3>'+
'<p>For anything you are unsure about before you publish. Eight-hour response, usually much faster. There is no such thing as a question too small for this channel, and asking has never counted against anybody.</p>'+
'<h3>If you are contacted by a regulator, an investigator or a lawyer</h3>'+
'<div class="rule"><b>What to do</b><p>Be polite. Do not answer questions about the company, the attorneys or your compensation. Say: <i>&ldquo;I would like to put you in touch with the company\u2019s compliance officer.&rdquo;</i> Then contact your manager immediately. This is not you being obstructive — you are not the right person to answer those questions accurately, and an inaccurate answer helps nobody.</p></div>'+
'<h3>Protection for reporting</h3>'+
'<p>Nobody in this programme has ever had their tier, rate or standing reduced for reporting a problem, including a problem they caused themselves. If you ever feel that reporting something cost you, raise it with People Operations directly — that is a failure of ours, not a risk you should have to weigh.</p>'},

{id:'c13',t:'Records and retention',body:
'<p class="lead">Everything is kept. That is a feature of the system rather than surveillance of you, and this page explains what is held and why.</p>'+
'<h3>What is retained</h3>'+
'<table><thead><tr><th>Record</th><th>Held for</th><th>Why</th></tr></thead><tbody>'+
'<tr><td>Every published piece and its caption</td><td>At least 2 years after last use</td><td>Advertising retention rules require a copy plus a record of when and where it ran.</td></tr>'+
'<tr><td>Review history and change requests</td><td>Life of the record</td><td>Shows a control environment actually operating.</td></tr>'+
'<tr><td>Consent captured on your link page</td><td>Life of the matter plus retention</td><td>Proves contact was requested, not initiated.</td></tr>'+
'<tr><td>Findings and remediation</td><td>Life of the record</td><td>Tier decisions must be explainable after the fact.</td></tr>'+
'<tr><td>Payments</td><td>Statutory accounting periods</td><td>Demonstrates flat compensation with no outcome correlation.</td></tr>'+
'</tbody></table>'+
'<h3>What this protects</h3>'+
'<p>Sooner or later somebody asks how a client found their attorney. The answer is a chain: this advertisement, approved on this date by this reviewer, published to this account, seen by this person, who then asked to be contacted, at this timestamp, having been shown this exact disclosure text.</p>'+
'<p>That chain is the product. It is also, incidentally, what protects you — because it makes it a matter of record that you did the job properly.</p>'+
'<h3>Do not delete published content</h3>'+
'<div class="rule never"><b>Important</b><p>Never delete an approved, published piece from your account without telling us. The retention obligation survives your decision to take something down, and a deleted post with no archived copy is a gap in the record that is difficult to explain. If you want something taken down, say so and it will be — archived properly first.</p></div>'},

{id:'c14',t:'Glossary',body:
'<p class="lead">Plain definitions of the words that appear in briefs, findings and this manual.</p>'+
'<table><thead><tr><th style="width:190px">Term</th><th>What it means here</th></tr></thead><tbody>'+
'<tr><td><b>Approved claim set</b></td><td>The list of statements cleared for a given theme. If a line is not traceable to one of them, it needs review.</td></tr>'+
'<tr><td><b>Capper / runner / steerer</b></td><td>Statutory terms for a paid intermediary who directs legal business to a lawyer. Criminal in several states. The reason your pay is flat.</td></tr>'+
'<tr><td><b>Change request</b></td><td>A specific named fix on a submission. Not a penalty.</td></tr>'+
'<tr><td><b>Clean rate</b></td><td>Share of your decided submissions approved with no changes asked. Thirty of your hundred score points.</td></tr>'+
'<tr><td><b>Finding</b></td><td>A recorded observation that something went wrong, with a severity and a status.</td></tr>'+
'<tr><td><b>Flight</b></td><td>An agreed set of deliverables over a fixed window, paid as a flat fee on completion.</td></tr>'+
'<tr><td><b>Inbound</b></td><td>Contact the other person started. The only kind we act on.</td></tr>'+
'<tr><td><b>Material connection</b></td><td>The fact that you are paid. Must be disclosed on everything.</td></tr>'+
'<tr><td><b>Matter</b></td><td>A person\u2019s potential legal claim. We use it instead of &ldquo;lead&rdquo; deliberately — a lead is something you buy.</td></tr>'+
'<tr><td><b>Responsible attorney</b></td><td>The named lawyer accountable for an advertisement\u2019s content. Attached at approval, never by you.</td></tr>'+
'<tr><td><b>Safe area</b></td><td>The region of frame no platform will crop. Disclosures live inside it.</td></tr>'+
'<tr><td><b>Severity</b></td><td>Sev-1 to Sev-4, set by consequence rather than by how it felt.</td></tr>'+
'<tr><td><b>Solicitation</b></td><td>Initiating contact with somebody who did not ask. Prohibited without exception.</td></tr>'+
'<tr><td><b>Tier</b></td><td>Probationary, Standard or Trusted. Sets your rates and your access to flights and events.</td></tr>'+
'</tbody></table>'+
'<h3>Still unclear?</h3>'+
'<p>Raise a compliance question. Eight-hour response and no such thing as a stupid one. The people answering would far rather explain something twice than adjudicate a finding once.</p>'}
];
VIEWS.mcompliance=manualView('mcompliance','Compliance manual',
 'Everything you are required to know, written to the ABA Model Rules and the federal rules that sit alongside them. Fourteen sections. Read it once end to end, then use it as a reference.',
 COMPLIANCE_SECTIONS,'doc-comp');

var CREATIVE_SECTIONS=[
{id:'r1',t:'What good looks like',body:
'<p class="lead">The best-performing content in this programme has never been the most polished. It has been the most useful.</p>'+
'<p>Somebody watching your video has usually just had one of the worst weeks of their life. Their car is gone, they are in pain, and an adjuster they have never met is asking them to sign something. They are not looking for entertainment. They are looking for one person who will tell them plainly what happens next.</p>'+
'<div class="rule yes"><b>The test</b><p>If somebody watched your video and did nothing else, would their week be slightly better? If yes, it will perform. If no, no amount of editing will save it.</p></div>'+
'<h3>Four things the top pieces have in common</h3>'+
'<ol>'+
'<li><b>One idea.</b> Not three tips and a bonus. One thing, explained properly.</li>'+
'<li><b>A specific moment.</b> &ldquo;When the adjuster calls and asks for a recorded statement&rdquo; beats &ldquo;know your rights&rdquo; every time, because the first one is a scene and the second one is a category.</li>'+
'<li><b>Calm.</b> Urgency reads as sales. Calm reads as competence. The subject matter supplies all the drama it needs.</li>'+
'<li><b>An obvious next step.</b> One action, stated once, at the end.</li>'+
'</ol>'+
'<h3>What consistently underperforms</h3>'+
'<ul>'+
'<li>Content about the company rather than about the viewer.</li>'+
'<li>Anything that sounds like a lawyer wrote it, because a lawyer\u2019s job is precision and yours is clarity.</li>'+
'<li>Trend-chasing that has nothing to do with the subject. The audio is not the idea.</li>'+
'<li>Anything that has to hedge so heavily it stops meaning anything.</li>'+
'</ul>'+
'<p>The last one is worth dwelling on. Being compliant is not the same as being vague. &ldquo;You are not required to give a recorded statement&rdquo; is both fully compliant and genuinely useful. Vagueness is usually a sign you have not yet decided what you are actually saying.</p>'},

{id:'r2',t:'Where ideas come from',body:
'<p class="lead">Nobody has ideas by sitting and waiting for one. They have ideas by collecting raw material and noticing patterns in it.</p>'+
'<h3>Five reliable sources</h3>'+
'<h4>1. Your comments and messages</h4>'+
'<p>The single best source, and the most underused. Every question somebody asks you is a piece of content that already has proven demand. Keep a note. When the same question turns up three times, that is not a coincidence, that is a brief.</p>'+
'<h4>2. What people say at events</h4>'+
'<p>People are more honest in person than in comments. The thing somebody tells you at a table at a festival — &ldquo;I did not know I could see my own doctor&rdquo; — is worth more than an hour of keyword research.</p>'+
'<h4>3. Your own life and the people around you</h4>'+
'<p>A cousin who works construction. A neighbour whose car was totalled. You are not going to talk about their situation, but their situation tells you what people do not know.</p>'+
'<h4>4. The theme briefs</h4>'+
'<p>Each brief carries an angle written by somebody who has seen what performed and what came back from review. Start there when you are stuck. There is no prize for originality inside a theme.</p>'+
'<h4>5. What went wrong for somebody else</h4>'+
'<p>&ldquo;The mistake I see most often&rdquo; is a durable format because it lets people learn without having to admit they need to.</p>'+
'<h3>Turning raw material into a piece</h3>'+
'<p>Take a real question and narrow it until it is a moment.</p>'+
'<table><thead><tr><th>Too broad</th><th>Getting closer</th><th>A piece</th></tr></thead><tbody>'+
'<tr><td>Know your rights</td><td>Talking to the insurance company</td><td>What to say when the adjuster asks for a recorded statement</td></tr>'+
'<tr><td>Workplace injuries</td><td>Reporting an injury at work</td><td>Why you report it in writing, on the same day, even if it seems minor</td></tr>'+
'<tr><td>Car accidents</td><td>What to do after a crash</td><td>The three photographs to take before the cars are moved</td></tr>'+
'</tbody></table>'+
'<h3>Keep an idea list</h3>'+
'<p>Ten lines in your phone notes. When it is time to shoot, you should be choosing from a list, not staring at a wall. Ambassadors who keep a list consistently produce more and stress less, and it is the single habit most correlated with staying in the programme.</p>'},

{id:'r3',t:'Writing the script',body:
'<p class="lead">Four parts. Total length under a hundred and twenty words for a forty-five second piece. If it is longer than that, something is being said twice.</p>'+
'<h3>The structure</h3>'+
'<h4>Hook — the first three seconds</h4>'+
'<p>Name the situation, not the topic. The viewer should recognise themselves immediately or scroll away immediately, and both outcomes are fine.</p>'+
'<div class="rule yes"><b>Works</b><p>&ldquo;If the insurance company already called you, listen to this before you call them back.&rdquo;<br>&ldquo;Si acabas de tener un choque, hay tres cosas que debes hacer hoy.&rdquo;</p></div>'+
'<div class="rule never"><b>Does not work</b><p>&ldquo;Hey guys, welcome back to my page.&rdquo;<br>&ldquo;Today I want to talk about personal injury.&rdquo;</p></div>'+
'<h4>Body — the useful part</h4>'+
'<p>Two or three concrete steps, in order, in plain words. Numbering them out loud helps people follow and helps you edit. Every sentence must trace to an approved claim or be a plain description of how a process works.</p>'+
'<h4>Proof — why you</h4>'+
'<p>One line. Not a credential, because you do not have one and should not imply one. Something true and human: you speak the language, you have sat with people through this, you answer at night.</p>'+
'<h4>Close — one action</h4>'+
'<p>One. Not &ldquo;like, follow, comment and click the link&rdquo;. Point at the link and stop talking. The most effective closes in this programme are the flattest ones.</p>'+
'<h3>Writing habits that survive review</h3>'+
'<ul>'+
'<li><b>Write it out before you shoot.</b> Improvised lines are where outcome guarantees come from. Nobody has ever accidentally promised a settlement while reading.</li>'+
'<li><b>Read it aloud.</b> If you stumble, the sentence is wrong. Fix the sentence, not your delivery.</li>'+
'<li><b>Check every verb about the future.</b> &ldquo;Will&rdquo; is the most dangerous word in this job. &ldquo;A lawyer can tell you&rdquo; is safe; &ldquo;a lawyer will get you&rdquo; is not.</li>'+
'<li><b>Cut the throat-clearing.</b> First sentence is almost always deletable.</li>'+
'<li><b>Run the claim check before you shoot,</b> not after you edit. Fixing a script costs a minute. Reshooting costs an afternoon.</li>'+
'</ul>'},

{id:'r4',t:'Working in two languages',body:
'<p class="lead">Most of the people we serve search, watch and call in Spanish. Spanish is not a translation layer here. It is the primary language of most of this work.</p>'+
'<h3>Author, do not translate</h3>'+
'<p>Write in the language you will speak. A script written in English and translated into Spanish sounds translated, and people can tell instantly. Worse, legal phrasing does not survive translation intact — a line that is precisely correct in English can become a promise in Spanish.</p>'+
'<div class="rule"><b>The rule</b><p>Every language version is written by a person who speaks it, checked by a person who speaks it, and reviewed in that language. The portal will draft a second-language version for you, but that draft is a starting point for a human. It is never a finished caption.</p></div>'+
'<h3>Register</h3>'+
'<p>Speak the way people actually speak in the communities you are in. Neutral Spanish reads as a call centre. Regional and warm reads as a neighbour. Follow the audience, not a textbook.</p>'+
'<p>Be careful in one direction only: warmth is good, slang about the subject matter is not. There is no informal register in which a legal claim becomes funny.</p>'+
'<h3>Code-switching</h3>'+
'<p>Mixing English and Spanish in one piece is fine and often natural — it is how a lot of the audience actually talks. Two conditions: the disclosure must be complete in one language rather than split across both, and the captions must match what was actually said.</p>'+
'<h3>Captions</h3>'+
'<ul>'+
'<li>Burn them in. Most people watch without sound.</li>'+
'<li>Caption in the language spoken. Do not caption Spanish audio in English.</li>'+
'<li>Never rely on platform auto-captions for a legal line. They are wrong often enough to matter.</li>'+
'<li>Keep them inside the safe area, and off the bottom third where the interface sits.</li>'+
'</ul>'},

{id:'r5',t:'Shooting',body:
'<p class="lead">You do not need better equipment. Almost every quality problem in this programme is one of four things, and all four are free to fix.</p>'+
'<h3>The four</h3>'+
'<h4>1. Sound</h4>'+
'<p>Bad audio kills a good video; mediocre picture does not. Get within arm\u2019s length of the phone. Put something soft behind you — a bed, a curtain, laundry — to kill the echo. Never shoot next to a road or an air conditioner. If you fix only one thing, fix this.</p>'+
'<h4>2. Light</h4>'+
'<p>Face a window. That is the entire lesson. Never have the window behind you. Overhead light alone will put shadows under your eyes and make you look exhausted, which undercuts the calm you are trying to project.</p>'+
'<h4>3. Framing</h4>'+
'<p>Vertical, always — 9:16. Camera at eye level, not below. Head near the top third, a little space above. Nine of the last forty submissions arrived in landscape and the crop pushed the disclosure out of frame, which meant a legally required notice was legally absent.</p>'+
'<h4>4. Stability</h4>'+
'<p>Lean the phone on something. Walking-and-talking looks energetic and reads as chaotic on a subject like this.</p>'+
'<h3>Where to shoot</h3>'+
'<table><thead><tr><th>Good</th><th>Avoid entirely</th></tr></thead><tbody>'+
'<tr><td>A plain wall at home</td><td>Any accident scene, real or staged</td></tr>'+
'<tr><td>Your car, parked, engine off</td><td>Any hospital, clinic or medical setting</td></tr>'+
'<tr><td>A community space you have permission to use</td><td>Any body shop, tow yard or impound lot</td></tr>'+
'<tr><td>An event where we are the sponsor</td><td>Anywhere with identifiable strangers in close-up</td></tr>'+
'</tbody></table>'+
'<div class="rule never"><b>Never stage an accident</b><p>No fake crashes, no simulated injuries, no dramatised scenes of impact. It reads as making light of what happened to the viewer, it invites the accusation that we are dramatising for profit, and it will be rejected on sight.</p></div>'+
'<h3>Practical</h3>'+
'<ul><li>Clean the lens. It is smeared. It is always smeared.</li>'+
'<li>Airplane mode, so a call does not land mid-take.</li>'+
'<li>Shoot the hook three times and pick one. It is the only part worth repeating.</li>'+
'<li>Leave a beat of silence at the start and end for the edit.</li></ul>'},

{id:'r6',t:'Editing',body:
'<p class="lead">The edit is where a compliant piece becomes a good one, and where a good one occasionally becomes non-compliant. Both happen in the same twenty minutes.</p>'+
'<h3>Pacing</h3>'+
'<ul>'+
'<li>Cut the first breath and the last one.</li>'+
'<li>Remove pauses, keep breaths. Removing every breath makes people sound anxious.</li>'+
'<li>One idea per cut. A cut in the middle of a thought reads as a jump.</li>'+
'<li>Forty-five seconds is a good target. Ninety is the ceiling and needs a reason.</li>'+
'</ul>'+
'<h3>The disclosure is a design element</h3>'+
'<p>Plan for it rather than bolting it on at the end. It needs to be legible for at least four seconds, inside the safe area, and in the same language as the content. If your composition leaves no room for it, the composition is wrong.</p>'+
'<div class="rule"><b>The order that saves time</b><p>Place the disclosure first, then the captions, then the visual treatment. Doing it the other way round means the disclosure lands wherever there happens to be space, which is how it ends up outside the safe area.</p></div>'+
'<h3>Music</h3>'+
'<p>Usually none. Music on this subject matter tends to read as either flippant or manipulative, and licensed beds are the safest choice when you do use one. Never use a trending track that carries associations at odds with the content.</p>'+
'<h3>Do not edit after approval</h3>'+
'<p>An approved piece is approved as it stands. If you change it afterwards — even the caption — the approval no longer covers what published. Republish through the portal instead. It takes minutes.</p>'+
'<h3>Before you export</h3>'+
'<ol><li>Watch it once with the sound off. Do the captions carry it?</li>'+
'<li>Watch it once at arm\u2019s length. Is the disclosure readable?</li>'+
'<li>Read your own script back. Any verb about the future?</li>'+
'<li>Run pre-flight. It catches the mechanical failures in about a minute.</li></ol>'},

{id:'r7',t:'Brand image',body:
'<p class="lead">The brand is deliberately simple: three colours, one mark, two typefaces. Simple is easy to get right and very obvious when got wrong.</p>'+
'<h3>Colour</h3>'+
'<table><thead><tr><th>Colour</th><th>Value</th><th>Use</th></tr></thead><tbody>'+
'<tr><td>Yellow</td><td class="mono">#FFBD15</td><td>The brand. Accent and primary action only.</td></tr>'+
'<tr><td>Black</td><td class="mono">#000000</td><td>Text and dark backgrounds.</td></tr>'+
'<tr><td>White</td><td class="mono">#FFFFFF</td><td>Light backgrounds and reversed text.</td></tr>'+
'</tbody></table>'+
'<p>There is no fourth colour. If a design needs one, the design needs rethinking.</p>'+
'<h3>The mark</h3>'+
'<div class="rule never"><b>The logo may never be</b><p>Recoloured, even slightly. Stretched or squashed. Rotated. Given a shadow, outline, glow or any effect. Rebuilt or redrawn. Combined with another mark or with text. Placed on a background that swallows it.</p></div>'+
'<p>Use the files in the brand kit. Do not pull the logo from an old flyer, a screenshot or somebody else\u2019s post — that is where recoloured versions come from, and it is a recurring finding.</p>'+
'<p>Contrast matters: yellow mark on dark, black mark on light, white mark on dark. Never yellow on a light background, where it disappears.</p>'+
'<h3>Type</h3>'+
'<p>Montserrat, or Gotham where licensed. Regular for body, bold for emphasis. Do not use a display font because it feels friendlier — the subject matter does not want a friendly font, it wants a clear one.</p>'+
'<h3>Tone of voice</h3>'+
'<table><thead><tr><th>We are</th><th>We are not</th></tr></thead><tbody>'+
'<tr><td>Plain</td><td>Formal or legalistic</td></tr>'+
'<tr><td>Calm</td><td>Urgent or alarming</td></tr>'+
'<tr><td>Warm</td><td>Casual about the subject</td></tr>'+
'<tr><td>Specific</td><td>Vague or hedged into meaninglessness</td></tr>'+
'<tr><td>Honest about limits</td><td>Over-promising</td></tr>'+
'</tbody></table>'+
'<p>The single sentence that captures it: <b>talk the way you would talk to a neighbour who just had a bad week, not the way an advertisement talks.</b></p>'},

{id:'r8',t:'Etiquette',body:
'<p class="lead">How you behave in comments, in messages and in person is part of the advertising. There is no off-duty version of this.</p>'+
'<h3>In comments</h3>'+
'<ul>'+
'<li><b>Answer questions about the process.</b> That is the job and it is where trust gets built.</li>'+
'<li><b>Never answer a question about somebody\u2019s specific situation.</b> &ldquo;I am not a lawyer, so I genuinely cannot answer that — but the attorney can, and the call is free.&rdquo;</li>'+
'<li><b>Never ask for details in a comment.</b> Do not ask what happened, where, or when.</li>'+
'<li><b>Never move to direct messages to collect a phone number.</b> Point at the link, always. That is not a formality — it is where consent is actually captured.</li>'+
'<li><b>Do not argue.</b> Ever, with anyone, about anything. Screenshots outlive the argument.</li>'+
'</ul>'+
'<h3>Hostile comments</h3>'+
'<p>You will get them: ambulance chaser, this is exploitation, lawyers are the problem. Three options and only three.</p>'+
'<ol><li>Ignore it. Usually correct.</li>'+
'<li>Answer once, plainly, without defensiveness. &ldquo;People get hurt and insurers have lawyers. That is the whole reason this exists.&rdquo;</li>'+
'<li>Report it and move on, if it is abusive or targets somebody else.</li></ol>'+
'<p>Never delete a critical comment simply for being critical. Deleting criticism looks worse than the criticism and is usually screenshotted first.</p>'+
'<h3>In person</h3>'+
'<ul><li>Be present, be visible, be easy to approach. Then wait.</li>'+
'<li>Answer what you are asked. Do not extend the conversation into their situation.</li>'+
'<li>The device goes into their hand. Always.</li>'+
'<li>Wear the branded items you were given, and only those. Do not make your own merchandise.</li></ul>'+
'<h3>With other ambassadors</h3>'+
'<p>Do not compete publicly. Do not comment on each other\u2019s content as though you are unconnected members of the public — that is undisclosed endorsement and it is exactly what the FTC guides are about. Support each other in the channel, where it belongs.</p>'},

{id:'r9',t:'Publishing and captions',body:
'<p class="lead">The caption is not an afterthought. It carries a legally required disclosure and it does most of the work of getting somebody to watch.</p>'+
'<h3>Caption structure</h3>'+
'<ol><li><b>The disclosure first,</b> in the first two lines, before any &ldquo;more&rdquo; cut. Non-negotiable, and the reason is simple: a disclosure hidden behind a tap has not been made.</li>'+
'<li><b>One line that earns the watch.</b> Restating the video verbatim wastes the space.</li>'+
'<li><b>The call to action.</b> Link in bio. Once.</li>'+
'<li><b>Hashtags last,</b> and few. Five relevant beats thirty scattershot.</li></ol>'+
'<div class="rule"><b>Caption template</b><p>#ad — Paid partnership with Accident Professionals. I am not an attorney and this is not legal advice.<br><br>The adjuster is allowed to ask. You are allowed to say not yet. 👇<br><br>Link in bio to ask for a call — free, and we speak Spanish.<br><br>#accidente #georgia #ayudalegal</p></div>'+
'<h3>Timing</h3>'+
'<p>Publish when your own audience is actually awake — your analytics know better than any general advice. Two things that do hold generally: evenings outperform mornings for this subject, and Sunday evening is consistently strong because people are dealing with a week that has just happened to them.</p>'+
'<h3>After you publish</h3>'+
'<ul><li>Stay in the comments for the first hour. That is where the questions are and where the callback requests come from.</li>'+
'<li>Log the post in the portal so the published link attaches to the approved creative. If you post from the socials module this happens automatically.</li>'+
'<li>Do not delete it later without telling us. The retention obligation outlives your decision to take it down.</li></ul>'},

{id:'r10',t:'Why work comes back',body:
'<p class="lead">The five reasons that account for almost every change request in this programme, in order of frequency, with the fix.</p>'+
'<h3>1. Disclosure in the video but not the caption</h3>'+
'<p>By a distance the most common. The fix: use the caption preview in the submit step. If the disclosure is not highlighted, it is not there.</p>'+
'<h3>2. A verb about the future</h3>'+
'<p>&ldquo;Will get&rdquo;, &ldquo;are going to receive&rdquo;, &ldquo;te conseguimos&rdquo;. Usually improvised rather than scripted. The fix: write the line down, then read every future-tense verb and ask whether it is about what we do or about what happens to them.</p>'+
'<h3>3. Advice instead of description</h3>'+
'<p>Almost always in a comment rather than in the video. The fix: keep one sentence ready — &ldquo;I am not a lawyer, so I genuinely cannot answer that, but the attorney can and the call is free.&rdquo;</p>'+
'<h3>4. Disclosure outside the safe area</h3>'+
'<p>Nearly always a landscape shoot cropped to vertical. The fix: shoot vertical and check the safe-area guide before export.</p>'+
'<h3>5. A claim outside the set</h3>'+
'<p>Usually something true that simply has not been cleared — &ldquo;we handle immigration too&rdquo;, &ldquo;we can get your car fixed&rdquo;. True is not the test; approved is. The fix: propose it as a claim through the theme proposal form and it may well be added.</p>'+
'<h3>The habit that removes most of this</h3>'+
'<div class="rule yes"><b>Ask before you shoot, not after you edit</b><p>The compliance channel answers in well under eight hours, usually in minutes. Ambassadors with the highest clean rates are not the most cautious ones — they are the ones who ask the most questions.</p></div>'+
'<h3>How to think about coming back</h3>'+
'<p>A change request is the system doing exactly what it exists to do. It caught something before it published, which is the entire point of having a review step. The people whose work never comes back are usually not the most careful — they are the ones making the least interesting content. Aim to be interesting and be corrected occasionally.</p>'}
];

/* ---------------- ABOUT ---------------- */
VIEWS.about={title:'What is not real',render:function(){
  var counts=[['Screens',Object.keys(VIEWS).length],['Actions',Object.keys(ACTIONS).length],
   ['Ambassadors',AMBASSADORS.length],['Staff',STAFF.length],['Submissions',SUBMISSIONS.length],
   ['Themes',THEMES.length],['Events',EVENTS.length],['Earnings lines',EARNINGS.length],
   ['Tickets',TICKETS.length],['Callback requests',CALLBACKS.length],['News posts',NEWS.length],
   ['Manual sections',COMPLIANCE_SECTIONS.length+CREATIVE_SECTIONS.length]];
  var h=phead('What is not real','Everything you can click here does something. This page says out loud what is behind it.','');
  h+='<div class="grid g2">'+
    '<div class="card p"><b style="font-size:14px">There is no backend</b>'+
    '<p style="font-size:13px;color:var(--ts);line-height:1.7;margin-top:7px">A single HTML file. No server, no database, no authentication, no network calls. The ambassador switcher in the header is a variable, not a login. Every change you make lives in memory and clears on reload.</p></div>'+
    '<div class="card p"><b style="font-size:14px">All data is synthetic</b>'+
    '<p style="font-size:13px;color:var(--ts);line-height:1.7;margin-top:7px">Every person, submission, event, finding and dollar was generated from a fixed seed (<span class="mono">0xA11BA5</span>). The same figures appear on every load. No real ambassador, claimant, employee or accident is represented.</p></div></div>';
  h+='<div class="card p" style="margin:14px 0"><b style="font-size:14px">What is in the build</b>'+
    '<div class="grid g4" style="margin-top:12px">'+counts.map(function(c){
      return '<div style="padding:10px;background:var(--card2);border-radius:8px">'+
        '<div class="mono" style="font-size:19px">'+c[1]+'</div>'+
        '<div style="font-size:11.5px;color:var(--tt)">'+esc(c[0])+'</div></div>'}).join('')+'</div></div>';
  h+='<div class="grid g2">'+
    '<div class="card p"><b style="font-size:14px">The logo is the supplied asset</b>'+
    '<p style="font-size:13px;color:var(--ts);line-height:1.7;margin-top:7px">The mark in the header is the vector from <span class="mono">AP_Logo_Horizontal_Yellow_High.svg</span>, inlined — the same paths, not a redraw and not a raster. Two things were neutralised so it works on every surface: the Gaussian drop-shadow filter, which the brand book forbids on the mark, and the hard-coded fill, which is now inherited from the surrounding text colour.</p>'+
    '<p style="font-size:13px;color:var(--ts);line-height:1.7;margin-top:9px">Worth flagging: the supplied file is coloured <span class="mono">#E0A100</span>, while the brand book states the principal yellow as <span class="mono">#FFBD15</span>. Those two facts contradict each other and one of them should be corrected at source.</p></div>'+
    '<div class="card p"><b style="font-size:14px">What a production build adds</b>'+
    '<ul style="font-size:12.5px;color:var(--ts);line-height:1.9;margin:8px 0 0 17px">'+
    ['Real OAuth to each platform, with tokens the ambassador can revoke',
     'A working publish pipeline and scheduler, not a mock composer',
     'A real non-linear editor — the editor here is an interface mockup',
     'Hosted link pages on the company domain with real form capture and consent records',
     'Payments integration, tax documents and a downloadable statement',
     'The detector ensemble behind the live compliance panel',
     'A full Spanish interface, authored rather than translated'].map(function(x){
      return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div></div>';
  h+='<div class="card p" style="margin-top:14px"><b style="font-size:14px">The manuals are drafts for review</b>'+
    '<p style="font-size:13px;color:var(--ts);line-height:1.7;margin-top:7px">Both manuals are written to the ABA Model Rules and the federal rules that sit alongside them, and they are structured for a national programme rather than a single state. They are a starting draft. Before they are issued to a real ambassador they need review by counsel in every state the programme operates in, because state adoptions of the model rules differ — particularly on solicitation waiting periods, advertising retention, and which of the criminal capper statutes apply.</p></div>';
  if(LOG.length){
    h+='<div class="card" style="margin-top:14px">'+cardHead('What you changed this session',LOG.length+' actions')+
      '<div class="cbody"><div class="tl">'+LOG.slice(0,14).map(function(l){
        return '<div class="tli"><div class="rowb"><span>'+esc(l.t)+'</span>'+
          '<span class="mono" style="font-size:11px;color:var(--tt)">'+new Date(l.at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</span></div></div>'}).join('')+
      '</div><button class="btn sm" style="margin-top:11px" data-act="clear-log">Clear the log</button></div></div>';
  } else {
    h+='<div style="margin-top:14px">'+empty('◧','Nothing changed yet','Submit a script, acknowledge an event brief, react to a post — whatever you do gets listed here so you can see exactly what the demo mutated.',
      '<button class="btn" data-act="nav" data-arg="home">Back to home</button>')+'</div>';
  }
  return h;
}};

function toast(t,b,tone,sim){
  var host=document.getElementById('toasts'); if(!host)return;
  var el=document.createElement('div');
  el.className='toast '+(tone||'');
  el.innerHTML='<b>'+esc(t)+'</b><span>'+esc(b||'')+'</span>'+(sim===false?'':'<span class="sim">demo — clears on reload</span>');
  host.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},5200);
}
function openModal(html){
  var s=document.getElementById('scrim'),h=document.getElementById('modalhost');
  if(!s||!h)return; h.innerHTML=html; s.classList.add('on');
  var fi=h.querySelector('input,textarea,select'); if(fi&&fi.focus)fi.focus();
}
function closeModal(){var s=document.getElementById('scrim');if(s)s.classList.remove('on')}
function modal(title,body,foot,wide){
  return '<div class="modal'+(wide?' wide':'')+'"><div class="mhead"><h2>'+title+'</h2>'+
    '<button class="x" data-act="close-modal">×</button></div><div class="mbody">'+body+'</div>'+
    (foot?'<div class="mfoot">'+foot+'</div>':'')+'</div>';
}
function formModal(title,intro,fields,act,label){
  return modal(esc(title),'<p style="font-size:13px;color:var(--ts);margin-bottom:15px;line-height:1.6">'+esc(intro)+'</p>'+
    fields.map(function(f){
      if(f.type==='select')return '<div class="field"><label>'+esc(f.l)+'</label><select data-f="'+esc(f.k)+'">'+
        f.opts.map(function(o){return '<option>'+esc(o)+'</option>'}).join('')+'</select>'+(f.h?'<div class="hint">'+esc(f.h)+'</div>':'')+'</div>';
      if(f.type==='textarea')return '<div class="field"><label>'+esc(f.l)+'</label><textarea data-f="'+esc(f.k)+'" placeholder="'+esc(f.p||'')+'"></textarea>'+(f.h?'<div class="hint">'+esc(f.h)+'</div>':'')+'</div>';
      return '<div class="field"><label>'+esc(f.l)+'</label><input data-f="'+esc(f.k)+'" placeholder="'+esc(f.p||'')+'" value="'+esc(f.v||'')+'">'+(f.h?'<div class="hint">'+esc(f.h)+'</div>':'')+'</div>';
    }).join(''),
    '<button class="btn" data-act="close-modal">Cancel</button><button class="btn pri" data-act="'+act+'">'+esc(label||'Submit')+'</button>');
}
function readForm(){
  var h=document.getElementById('modalhost'),o={};
  if(!h||!h.querySelectorAll)return o;
  var els=h.querySelectorAll('[data-f]');
  for(var i=0;i<els.length;i++)o[els[i].getAttribute('data-f')]=els[i].value||'';
  return o;
}
function commit(msg,detail,tone){recompute();closeModal();render();if(msg){toast(msg,detail,tone);logAction(msg+(detail?' — '+detail:''))}}
function go(v,sub){if(!VIEWS[v])v='home';state.view=v;if(sub!==undefined)state.sub=sub;state.railOpen=false;closeModal();render()}

var ACTIONS={};
ACTIONS['nav']=function(a){state.sub='';state.mode='';state.doc='';go(a)};
ACTIONS['toggle-rail']=function(){state.railOpen=!state.railOpen;render()};

ACTIONS['noopstat']=function(){toast('Already here','This figure is computed from the records on this screen.','',false)};
ACTIONS['theme']=function(){var r=document.documentElement,t=r.getAttribute('data-theme')==='dark'?'light':'dark';
  r.setAttribute('data-theme',t);toast('Theme switched','Now using the '+t+' surface set.','',false)};

  toast('Signed in as '+me().name,me().tier+' ambassador · '+me().geo,'',false);
};

ACTIONS['cite']=function(a){
  var notes={
   'ABA Model Rule 7.1':'Prohibits false or misleading communications about a lawyer or the lawyer\u2019s services, including anything likely to create an unjustified expectation about results. This is the rule behind every "no guarantees" instruction in your manual.',
   'ABA Model Rule 7.1(b)':'The unjustified-expectation limb of Rule 7.1. A statement can be perfectly true and still breach it if it leads a reasonable person to expect a particular result.',
   'ABA Model Rule 7.2(b)':'A lawyer may not give anything of value to a person for recommending their services, with a narrow exception permitting payment of the reasonable costs of advertisements. Flat production and flight fees fall inside that exception. Per-case payment does not.',
   'ABA Model Rule 7.3':'Restricts live person-to-person solicitation of somebody who has not sought contact. This is why every contact in this programme is inbound.',
   'ABA Model Rule 5.5':'Unauthorized practice of law. You are not a lawyer, so advising an individual about their own situation is outside what you may do, regardless of how confident you are about the answer.',
   '16 CFR Part 255':'FTC Endorsement Guides. A material connection between you and the brand must be disclosed clearly and conspicuously, on every piece, in a way the audience will actually see.',
   '47 CFR 64.1200':'The TCPA implementing rules. Prior express written consent is required before an automated call or text. It is why the call-back form is fixed and why you must never collect a number in your messages.'
  };
  openModal(modal(esc(a),'<p style="line-height:1.75;font-size:13.5px">'+esc(notes[a]||'Cited authority. In a production build this opens the source text alongside the rule that references it.')+'</p>'+
    '<p style="font-size:12.5px;color:var(--tt);margin-top:14px">Your state has adopted its own version of this rule. Raise a compliance question if you need the exact citation for a specific state.</p>',
    '<button class="btn" data-act="close-modal">Close</button>'));
};

ACTIONS['open-task']=function(a){
  var t=tasksFor(meId()).filter(function(x){return x.id===a})[0]; if(!t)return;
  openModal(modal('Task',
    '<div class="rowb" style="margin-bottom:12px">'+pill(t.pri==='HIGH'?'p-bad':t.pri==='LOW'?'p-neutral':'p-info',t.pri)+
    (t.due<NOW?pill('p-bad','Late'):pill('p-neutral','Due '+fdate(t.due)))+'</div>'+
    '<div style="font-size:16px;font-weight:700;margin-bottom:6px">'+esc(t.t)+'</div>'+
    '<p style="font-size:13px;color:var(--ts)">'+esc(t.s)+'</p>',
    '<button class="btn" data-act="close-modal">Close</button>'+
    (t.done?'':'<button class="btn pri" data-act="finish-task" data-arg="'+t.id+'">Mark done</button>')));
};

ACTIONS['open-cb']=function(a){
  var c=CALLBACKS.filter(function(x){return x.id===a})[0]; if(!c)return;
  openModal(modal('Callback request',
    '<div class="rowb" style="margin-bottom:12px"><div><div style="font-size:16px;font-weight:700">'+esc(c.name)+'</div>'+
    '<div style="font-size:12px;color:var(--tt)" class="mono">'+c.id+' · '+ftime(c.at)+'</div></div>'+
    pill(c.status==='CONNECTED'?'p-ok':c.status==='UPCOMING'?'p-warn':'p-bad',c.status)+'</div>'+
    '<dl class="kv"><dt>What happened</dt><dd>'+esc(c.kind)+'</dd>'+
    '<dt>County</dt><dd>'+esc(c.county)+'</dd>'+
    '<dt>Language</dt><dd>'+(c.lang==='ES'?'Spanish':'English')+'</dd>'+
    '<dt>Came from</dt><dd>'+esc(c.via)+'</dd>'+
    '<dt>Consent</dt><dd>'+pill('p-ok','Captured')+' at '+ftime(c.at)+', with the disclosure text shown</dd></dl>'+
    '<div style="margin-top:14px;padding:12px;background:var(--card2);border-radius:8px;font-size:12.5px;line-height:1.65;color:var(--ts)">'+
    '<b style="color:var(--tp)">This is not yours to call.</b> Intake handles every callback. You are seeing it because it came from your page and it is how your reach is measured. Contacting this person yourself would make the contact ours rather than theirs, and that is the one line the whole programme is built around.</div>',
    '<button class="btn" data-act="close-modal">Close</button>'+
    '<button class="btn" data-act="nav" data-arg="callback">Open my link page</button>'));
};
ACTIONS['open-sub']=function(a){
  var s=submission(a); if(!s)return;
  var st=stageOf(s.stage);
  openModal(modal('Submission '+esc(s.id),
    '<div class="rowb" style="margin-bottom:12px"><div><div style="font-size:16px;font-weight:700">'+esc(s.title)+'</div>'+
