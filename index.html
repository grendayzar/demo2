<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambassador Portal — Accident Professionals</title>
<meta name="theme-color" content="#FFBD15">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --y:#FFBD15; --yd:#E0A100; --ysoft:#FFF6DC;
  --ok:#1E8E5A; --oksoft:#E6F4EC;
  --warn:#C98A00; --warnsoft:#FDF3DC;
  --bad:#C0392B; --badsoft:#FBEBE9;
  --info:#2F6FAD; --infosoft:#E9F1F8;
  --r:10px; --rs:6px;
  --f:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
html[data-theme="light"]{
  --bg:#F5F5F4; --card:#FFFFFF; --card2:#FAFAF9; --line:#E5E4E1; --line2:#EFEEEB;
  --tp:#1A1A18; --ts:#6B6A66; --tt:#9A9995; --shadow:0 1px 2px rgba(0,0,0,.04);
}
html[data-theme="dark"]{
  --bg:#0E0E0D; --card:#171716; --card2:#1E1E1C; --line:#2C2C29; --line2:#242422;
  --tp:#F5F5F3; --ts:#A3A29D; --tt:#6E6D69; --shadow:0 1px 2px rgba(0,0,0,.5);
  --oksoft:#12301F; --warnsoft:#332703; --badsoft:#331714; --infosoft:#0F2436; --ysoft:#332A0B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tp);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--y);color:#000}
:focus-visible{outline:2px solid var(--y);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--ts)} .dim{color:var(--tt)}
.row{display:flex;align-items:center;gap:8px}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1;min-width:0}
.seclabel{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tt);margin:26px 0 10px}
.seclabel:first-child{margin-top:0}

/* ---------- SHELL ---------- */
#app{display:grid;grid-template-rows:56px 1fr;height:100vh}
#top{display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);z-index:40}
#shell{display:grid;grid-template-columns:238px 1fr;min-height:0}
#rail{background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px 40px}
#main{overflow-y:auto;padding:22px 26px 70px;min-width:0}
.logo{height:22px;width:auto;color:var(--tp);display:block}
.logo svg{height:22px;width:auto;display:block}
.isomark{width:26px;height:26px;color:#000;background:var(--y);border-radius:5px;display:grid;place-items:center;flex:none}
.isomark svg{width:15px;height:15px;display:block}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:5px;letter-spacing:.03em;white-space:nowrap;text-transform:uppercase}
.p-ok{color:var(--ok);background:var(--oksoft)}
.p-warn{color:var(--warn);background:var(--warnsoft)}
.p-bad{color:var(--bad);background:var(--badsoft)}
.p-info{color:var(--info);background:var(--infosoft)}
.p-neutral{color:var(--ts);background:var(--line2)}
.p-brand{color:#7A5A00;background:var(--ysoft)}
html[data-theme="dark"] .p-brand{color:var(--y)}

/* ---------- NAV ---------- */
.navgrp{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tt);padding:14px 10px 5px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:var(--rs);color:var(--ts);font-size:13px;font-weight:500;text-align:left}
.navitem:hover{background:var(--card2);color:var(--tp)}
.navitem.on{background:var(--ysoft);color:var(--tp);font-weight:600}
html[data-theme="dark"] .navitem.on{background:#2A230B}
.navitem .ico{width:17px;text-align:center;flex:none;opacity:.9;font-size:13px}
.navitem .bdg{margin-left:auto;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;background:var(--line2);color:var(--ts);font-family:var(--fm)}
.navitem .bdg.hot{background:var(--bad);color:#fff}
.navitem .bdg.warn{background:var(--y);color:#000}

/* ---------- CARDS ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.p{padding:16px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.chead h3{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tp)}
.chead .meta{font-size:11.5px;color:var(--tt)}
.cbody{padding:14px 16px}
.cbody.n{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.gdash{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr)}
@media(max-width:1250px){.gdash,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1000px){.gdash,.g3,.g23,.g2,.g4{grid-template-columns:1fr}}

/* ---------- PAGE HEAD ---------- */
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.phead h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.phead p{color:var(--ts);font-size:13px;margin-top:4px;max-width:80ch}

/* ---------- LIST ROWS (screenshot style) ---------- */
.lrow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line2);text-align:left;width:100%}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:var(--card2)}
.lrow .when{width:52px;flex:none;font-size:11.5px;color:var(--ts);font-family:var(--fm)}
.lrow .when.late{color:var(--bad);font-weight:700;font-family:var(--f);font-size:11px;letter-spacing:.05em}
.lrow .t{font-size:13.5px;font-weight:600;line-height:1.3}
.lrow .s{font-size:11.5px;color:var(--tt);margin-top:2px}
.scroller{max-height:300px;overflow-y:auto}

/* ---------- GOAL BARS ---------- */
.goal{padding:11px 0;border-bottom:1px solid var(--line2)}
.goal:last-child{border-bottom:none}
.goal .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
.goal .lbl{font-size:13.5px;font-weight:500}
.goal .v{font-family:var(--fm);font-size:16px;font-weight:600}
.goal .u{font-size:11px;color:var(--tt);margin-left:6px}
.track{height:4px;border-radius:3px;background:var(--line2);overflow:hidden}
.track>i{display:block;height:100%;border-radius:3px}

/* ---------- CALENDAR STRIP ---------- */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media(max-width:1250px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:760px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
.day{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;background:var(--card);min-height:118px;display:flex;flex-direction:column;gap:5px}
.day:hover{border-color:var(--tt)}
.day.today{border:2px solid var(--ok);box-shadow:0 0 0 3px var(--oksoft)}
.day .dh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px}
.day .dw{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--tt);text-transform:uppercase}
.day .dn{font-family:var(--fm);font-size:16px;font-weight:600}
.day.today .dn,.day.today .dw{color:var(--ok)}
.evt{font-size:10.5px;padding:3px 6px;border-radius:4px;background:var(--card2);border-left:2px solid var(--tt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4}
.evt.brand{border-left-color:var(--y)} .evt.ok{border-left-color:var(--ok)}
.evt.warn{border-left-color:var(--warn)} .evt.bad{border-left-color:var(--bad)} .evt.info{border-left-color:var(--info)}
.day .more{font-size:10.5px;color:var(--tt);margin-top:auto}
.day .due{font-size:10.5px;color:var(--ts);font-weight:600}

/* ---------- ATTENTION ---------- */
.att{padding:13px 16px;border-bottom:1px solid var(--line2);text-align:left;width:100%}
.att:last-child{border-bottom:none}
.att:hover{background:var(--card2)}
.att .n{font-size:13.5px;font-weight:700}
.att .ref{font-size:12px;color:var(--tt);margin-left:6px;font-family:var(--fm)}
.att .why{font-size:12.5px;color:var(--bad);margin-top:3px}
.att .why.warn{color:var(--warn)}

/* ---------- STAT ---------- */
.stat{padding:14px 16px}
.stat .k{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tt)}
.stat .v{font-family:var(--fm);font-size:25px;font-weight:600;line-height:1.15;margin-top:6px}
.stat .d{font-size:11.5px;color:var(--ts);margin-top:4px}

/* ---------- TABLES ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
thead th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tt);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.num{text-align:right}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover{background:var(--card2)}
td.num{font-family:var(--fm);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:var(--rs);font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--tp);white-space:nowrap}
.btn:hover{border-color:var(--tt)}
.btn.pri{background:var(--y);color:#000;border-color:var(--y)}
.btn.pri:hover{background:var(--yd);border-color:var(--yd)}
.btn.dark{background:var(--tp);color:var(--card);border-color:var(--tp)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ts)}
.btn.ghost:hover{background:var(--card2);color:var(--tp)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 13px;font-size:13px;font-weight:600;color:var(--ts);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--tp);border-bottom-color:var(--y)}
.tab:hover{color:var(--tp)}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:var(--rs);padding:2px;gap:2px}
.seg button{padding:5px 11px;border-radius:4px;font-size:12px;font-weight:600;color:var(--ts)}
.seg button.on{background:var(--card);color:var(--tp);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 8px;border-radius:5px;background:var(--card2);border:1px solid var(--line);color:var(--ts);white-space:nowrap}
.chip.on{border-color:var(--y);background:var(--ysoft);color:var(--tp)}

/* ---------- AVATAR ---------- */
.av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--line2);color:var(--ts);border:1px solid var(--line)}
.av.y{background:var(--y);color:#000;border-color:var(--y)}
.av.lg{width:44px;height:44px;font-size:14px}
.av.sm{width:24px;height:24px;font-size:9px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* ---------- FORMS ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tt);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--rs);padding:8px 10px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--y);background:var(--card)}
.field textarea{min-height:84px;resize:vertical;font-family:inherit}
.hint{font-size:11px;color:var(--tt);margin-top:4px}

/* ---------- MODAL / TOAST ---------- */
#scrim{position:fixed;inset:0;background:rgba(20,20,18,.55);z-index:90;display:none;padding:34px 16px;overflow-y:auto}
#scrim.on{display:block}
.modal{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.28);overflow:hidden}
.modal.wide{max-width:1000px}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:16px;font-weight:700}
.mbody{padding:20px;max-height:66vh;overflow-y:auto}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:13px 20px;border-top:1px solid var(--line);background:var(--card2)}
.x{width:28px;height:28px;border-radius:var(--rs);display:grid;place-items:center;color:var(--ts);font-size:17px;flex:none}
.x:hover{background:var(--card2);color:var(--tp)}
#toasts{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:370px}
.toast{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--y);border-radius:var(--rs);padding:11px 13px;box-shadow:0 8px 26px rgba(0,0,0,.16);animation:ti .18s ease}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)} .toast.bad{border-left-color:var(--bad)}
.toast b{display:block;font-size:12.5px;margin-bottom:2px}
.toast span{font-size:11.5px;color:var(--ts)}
.toast .sim{display:block;font-size:10px;color:var(--tt);margin-top:5px;font-family:var(--fm)}
@keyframes ti{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dd{position:relative}
.ddm{position:absolute;top:calc(100% + 6px);right:0;min-width:250px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 34px rgba(0,0,0,.18);z-index:60;padding:6px;max-height:420px;overflow-y:auto}
.ddm button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:var(--rs);font-size:13px;color:var(--ts)}
.ddm button:hover{background:var(--card2);color:var(--tp)}
.ddh{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tt);padding:9px 10px 4px}
.empty{padding:40px 20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);background:var(--card)}
.empty .e{font-size:24px;margin-bottom:8px;opacity:.45}
.empty b{display:block;font-size:14px;margin-bottom:4px}
.empty span{font-size:12.5px;color:var(--ts);display:block;max-width:46ch;margin:0 auto 12px}

/* ---------- SOCIAL EMBED ---------- */
.embed{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.ebar{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line2);background:var(--card2)}
.ebar .u{font-size:12px;font-weight:600}
.ebody{padding:12px;min-height:150px}
.phone{width:200px;aspect-ratio:9/16;border-radius:14px;background:linear-gradient(165deg,#26262a,#3a3a42);position:relative;overflow:hidden;flex:none;border:5px solid #111}
.phone .cap{position:absolute;left:9px;right:9px;bottom:34px;font-size:8.5px;text-align:center;background:rgba(0,0,0,.62);color:#fff;padding:4px;border-radius:3px;line-height:1.35}
.phone .dis{position:absolute;left:9px;right:9px;bottom:9px;font-size:6.5px;text-align:center;color:rgba(255,255,255,.75);line-height:1.3}
.phone .lg{position:absolute;top:9px;right:9px;background:var(--y);color:#000;font-size:6.5px;font-weight:700;padding:2px 5px;border-radius:2px}
.phone .safe{position:absolute;inset:9px;border:1px dashed rgba(255,189,21,.32);border-radius:5px}

/* ---------- EDITOR ---------- */
.edit{display:grid;grid-template-columns:150px 1fr 230px;gap:12px;align-items:start}
@media(max-width:1100px){.edit{grid-template-columns:1fr}}
.tool{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--rs);width:100%;text-align:left;font-size:12.5px;color:var(--ts)}
.tool:hover{background:var(--card2);color:var(--tp)}
.tool.on{background:var(--ysoft);color:var(--tp);font-weight:600}
html[data-theme="dark"] .tool.on{background:#2A230B}
.trk{display:flex;align-items:center;gap:8px;margin-bottom:5px;min-width:500px}
.trk .lbl{width:66px;flex:none;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tt)}
.trk .lane{flex:1;height:26px;background:var(--bg);border-radius:5px;position:relative;overflow:hidden;border:1px solid var(--line2)}
.clip{position:absolute;top:3px;bottom:3px;border-radius:3px;font-size:9px;display:flex;align-items:center;padding:0 6px;color:#111;font-weight:600;overflow:hidden;white-space:nowrap;cursor:pointer}
.play{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:3}

/* ---------- LINK PAGE ---------- */
.lp{width:290px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;flex:none}
.lp .hero{background:#111;padding:18px;text-align:center;color:#fff}
.lp .hero .av{margin:0 auto 9px}
.lnk{display:block;margin:8px 12px;padding:10px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:600;text-align:center}
.lnk.pri{background:var(--y);border-color:var(--y);color:#000}
.lpform{margin:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card2)}
.lpform input,.lpform select{width:100%;margin-bottom:7px;padding:7px 9px;font-size:12px;border:1px solid var(--line);border-radius:5px;background:var(--card)}

/* ---------- MANUAL ---------- */
.manual{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:980px){.manual{grid-template-columns:1fr}}
.toc{position:sticky;top:0;max-height:calc(100vh - 130px);overflow-y:auto}
.toc button{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:var(--rs);font-size:12.5px;color:var(--ts);line-height:1.35}
.toc button:hover{background:var(--card2);color:var(--tp)}
.toc button.on{background:var(--ysoft);color:var(--tp);font-weight:600}
html[data-theme="dark"] .toc button.on{background:#2A230B}
.doc{font-size:14px;line-height:1.72;max-width:74ch}
.doc h2{font-size:20px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.doc h3{font-size:15px;font-weight:700;margin:26px 0 8px}
.doc h4{font-size:13px;font-weight:700;margin:18px 0 6px;color:var(--ts)}
.doc p{margin:0 0 13px;color:var(--tp)}
.doc ul,.doc ol{margin:0 0 14px 20px}
.doc li{margin-bottom:7px}
.doc .lead{font-size:15px;color:var(--ts);margin-bottom:20px}
.doc .rule{border-left:3px solid var(--y);background:var(--ysoft);padding:12px 15px;border-radius:0 6px 6px 0;margin:0 0 16px}
html[data-theme="dark"] .doc .rule{background:#2A230B}
.doc .rule b{display:block;margin-bottom:4px;font-size:13px}
.doc .rule p{margin:0;font-size:13px;color:var(--ts)}
.doc .never{border-left:3px solid var(--bad);background:var(--badsoft)}
.doc .yes{border-left:3px solid var(--ok);background:var(--oksoft)}
.doc .cite{font-family:var(--fm);font-size:11.5px;color:var(--info);border-bottom:1px dotted currentColor;cursor:pointer}
.doc table{min-width:0;font-size:12.5px;margin-bottom:16px}
.doc table th{padding:8px 10px}
.doc table td{padding:8px 10px}
.pnav{display:flex;justify-content:space-between;gap:10px;margin-top:30px;padding-top:16px;border-top:1px solid var(--line)}

/* ---------- CHAT ---------- */
.msgs{display:flex;flex-direction:column;gap:2px;padding:14px}
.msg{display:flex;gap:10px;padding:6px 4px;border-radius:var(--rs)}
.msg:hover{background:var(--card2)}
.msg .who{font-weight:600;font-size:12.5px}
.msg .t{font-size:10px;color:var(--tt);font-family:var(--fm)}
.msg .tx{font-size:13px;white-space:pre-wrap;word-break:break-word}
.msg.me .who{color:var(--yd)}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--card)}
.composer input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px}
.composer input:focus{outline:none;border-color:var(--y)}

/* ---------- FEED ---------- */
.post{padding:16px;border-bottom:1px solid var(--line2)}
.post:last-child{border-bottom:none}
.post .ph{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.post .body{font-size:13.5px;line-height:1.65;color:var(--tp);white-space:pre-wrap}
.post .rx{display:flex;gap:6px;margin-top:11px}
.post .rx b{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--card2);border:1px solid var(--line);cursor:pointer}
.post .rx b:hover{border-color:var(--y)}

/* ---------- MISC ---------- */
.bar{height:6px;border-radius:4px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--y)}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring span{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--fm);font-size:22px;font-weight:600}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tli{position:relative;padding:8px 0;font-size:12.5px}
.tli::before{content:"";position:absolute;left:-20px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--tt);border:2px solid var(--card)}
.tli.ok::before{background:var(--ok)} .tli.warn::before{background:var(--y)} .tli.bad::before{background:var(--bad)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 14px;font-size:13px}
.kv dt{color:var(--tt);font-size:12px}
#hamb{display:none}
footer.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--tt);line-height:1.7}
@media(max-width:900px){
  #shell{grid-template-columns:1fr}
  #rail{position:fixed;top:56px;bottom:0;left:0;width:238px;z-index:50;transform:translateX(-100%);transition:transform .18s}
  #rail.open{transform:none;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  #hamb{display:grid}
  #main{padding:16px 14px 60px}
  .searchbox{display:none}
}
</style>
</head>

<div id="app">
  <div id="top">
    <button id="hamb" class="x" data-act="toggle-rail" title="Menu">☰</button>
    <span class="logo" id="topLogo"></span>
    <span class="pill p-brand" style="margin-left:2px">Ambassador Portal</span>
    <div style="flex:1"></div>
    <button class="btn ghost sm searchbox" data-act="palette">Search <span class="mono" style="margin-left:6px;font-size:10px">⌘K</span></button>
    <div class="dd"><button class="btn ghost sm" data-act="bell">🔔 <span id="bellcount" class="pill p-bad">0</span></button><div id="bellmenu"></div></div>
    <button class="btn ghost sm" data-act="theme" title="Theme">◐</button>
    <div class="dd"><button class="btn sm" id="mebtn" data-act="who"></button><div id="whomenu"></div></div>
  </div>
  <div id="shell"><nav id="rail"></nav><main id="main"></main></div>
</div>
<div id="scrim"><div id="modalhost"></div></div>

    <input id="pq" placeholder="Jump to a screen…" autocomplete="off" style="width:100%;background:transparent;border:none;padding:15px 17px;font-size:15px;border-bottom:1px solid var(--line);outline:none">
    <div id="plist" style="max-height:380px;overflow-y:auto;padding:6px"></div>
  </div>
</div>

/* ---------------- derived figures ---------------- */
var K={};
function computeK(){
  var id=meId(),a=me(),o={};
  var subs=subsFor(id);
  o.subs=subs.length;
  o.published=subs.filter(function(s){return s.stage==='PUBLISHED'}).length;
  o.inReview=subs.filter(function(s){return ['SUBMITTED','AI_REVIEW','HUMAN'].indexOf(s.stage)>=0}).length;
  o.changes=subs.filter(function(s){return s.stage==='CHANGES'}).length;
  o.drafts=subs.filter(function(s){return s.stage==='DRAFT'}).length;
  o.approved=subs.filter(function(s){return s.stage==='APPROVED'}).length;
  o.rejected=subs.filter(function(s){return s.stage==='REJECTED'}).length;
  var decided=subs.filter(function(s){return ['PUBLISHED','APPROVED','CHANGES','REJECTED'].indexOf(s.stage)>=0});
  o.cleanRate=decided.length?Math.round(decided.filter(function(s){return ['PUBLISHED','APPROVED'].indexOf(s.stage)>=0&&!s.revisions}).length/decided.length*100):0;
  o.views=subs.reduce(function(s,x){return s+x.views},0);
  o.taps=subs.reduce(function(s,x){return s+x.taps},0);
  o.reach=reach(a);
  var t=tasksFor(id);
  o.tasks=t.filter(function(x){return !x.done}).length;
  o.late=t.filter(function(x){return !x.done&&x.due<NOW}).length;
  o.dueToday=t.filter(function(x){return !x.done&&dayOffset(x.due)===0}).length;
  var cb=callbacksFor(id);
  o.cbToday=cb.length;
  o.cbDone=cb.filter(function(c){return c.status==='CONNECTED'}).length;
  o.cbUp=cb.filter(function(c){return c.status==='UPCOMING'}).length;
  o.cbNo=cb.filter(function(c){return c.status==='NO ANSWER'}).length;
  o.score=a.score; o.tier=a.tier;
  var nx=TIER_RULES.filter(function(r){return r.min>a.score}).sort(function(x,y){return x.min-y.min})[0];
  o.nextTier=nx?nx:null;
  o.findOpen=findingsFor(id).filter(function(f){return f.status==='SUBSTANTIATED'}).length;
  o.paid=earnSum(id,['PAID']); o.approvedPay=earnSum(id,['APPROVED']);
  o.pending=earnSum(id,['PENDING','SCHEDULED']);
  o.ytd=o.paid+o.approvedPay;
  o.tickets=ticketsFor(id).filter(function(x){return x.status!=='RESOLVED'}).length;
  o.evUpcoming=eventsFor(id).filter(function(e){return e.when>NOW}).length;
  o.evDone=eventsFor(id).filter(function(e){return e.status==='COMPLETED'}).length;
  o.evNeedAck=eventsFor(id).filter(function(e){return e.when>NOW&&e.briefAck.indexOf(id)<0}).length;
  o.callbacksTotal=cb.length;
  o.certDays=Math.round((a.certExpires-NOW)/DAY);
  return o;
}
function recompute(){K=computeK()}

/* ---------------- attention ---------------- */
function attention(){
  var id=meId(),out=[];
  function A(sev,n,ref,why,act,arg){out.push({sev:sev,n:n,ref:ref,why:why,act:act,arg:arg})}
  subsFor(id).filter(function(s){return s.stage==='CHANGES'}).forEach(function(s){
    A('bad','Changes requested',s.id,'"'+s.title+'" — resubmit to keep it in this week\u2019s flight','open-sub',s.id)});
  subsFor(id).filter(function(s){return s.stage==='REJECTED'}).forEach(function(s){
    A('bad','Submission rejected',s.id,s.notes.split('.')[0]+'.','open-sub',s.id)});
  tasksFor(id).filter(function(t){return !t.done&&t.due<NOW}).forEach(function(t){
    A('bad','Task is late',t.id,t.t,'open-task',t.id)});
  eventsFor(id).filter(function(e){return e.when>NOW&&e.briefAck.indexOf(id)<0}).forEach(function(e){
    A('bad','Compliance brief not acknowledged',e.id,e.n+' — you will be turned away at check-in','open-event',e.id)});
  if(K.certDays<45)A('warn','Certification expires soon','Annual',K.certDays+' days left. Your tier freezes until it is renewed.','nav','compliance');
  findingsFor(id).filter(function(f){return f.status==='SUBSTANTIATED'}).forEach(function(f){
    A('warn','Open finding',f.id,f.cat+' — '+f.remedy,'open-finding',f.id)});
  callbacksFor(id).filter(function(c){return c.status==='NO ANSWER'}).forEach(function(c){
    A('warn','Callback went unanswered',c.id,c.name+' — '+c.kind+', '+c.county+' County','open-cb',c.id)});
  ticketsFor(id).filter(function(t){return t.status==='OPEN'}).forEach(function(t){
    A('warn','Ticket still open',t.id,t.subject,'open-ticket',t.id)});
  return out;
}

function dayEventsFor(id,off){
  var out=[];
  tasksFor(id).filter(function(t){return !t.done&&dayOffset(t.due)===off}).forEach(function(t){
    out.push({t:t.t,tone:t.pri==='HIGH'?'bad':t.pri==='LOW'?'':'warn',act:'open-task',arg:t.id,kind:'task'})});
  callbacksFor(id).filter(function(c){return dayOffset(c.at)===off}).forEach(function(c){
    out.push({t:ftime(c.at)+' '+c.name,tone:'info',act:'open-cb',arg:c.id,kind:'call'})});
  eventsFor(id).filter(function(e){return dayOffset(e.when)===off}).forEach(function(e){
    out.push({t:e.n,tone:'brand',act:'open-event',arg:e.id,kind:'event'})});
  subsFor(id).filter(function(s){return s.stage==='CHANGES'&&dayOffset(s.submitted+2*DAY)===off}).forEach(function(s){
    out.push({t:'Resubmit — '+s.title,tone:'bad',act:'open-sub',arg:s.id,kind:'task'})});
  return out;
}
